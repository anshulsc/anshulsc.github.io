<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/>
    </marker>
    <marker id="p-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-amber, #d97706)"/>
    </marker>
    <marker id="p-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-muted-2, #888)"/>
    </marker>
  </defs>

  <!-- REAL BRANCH -->
  <rect x="18" y="28" width="132" height="58" rx="10" fill="rgba(14,116,144,0.08)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5"/>
  <text x="84" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fig-teal, #0e7490)">Dataset D</text>
  <text x="84" y="71" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">x₁ … x_N  ~  P_x</text>
  <path d="M 150 57 L 246 57" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6" fill="none" marker-end="url(#p-t)"/>
  <text x="198" y="49" text-anchor="middle" font-size="10" fill="var(--fig-teal, #0e7490)">real x</text>

  <!-- FAKE BRANCH -->
  <rect x="18" y="196" width="86" height="52" rx="10" fill="var(--fig-wash, #f7f7f7)" stroke="var(--fig-faint, #aaa)" stroke-width="1.3"/>
  <text x="61" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fig-ink-2, #555)">noise z</text>
  <text x="61" y="235" text-anchor="middle" font-size="10" fill="var(--fig-muted, #777)">𝒩(0, I) ∈ ℝᵏ</text>
  <path d="M 104 222 L 126 222" stroke="var(--fig-muted-2, #888)" stroke-width="1.4" fill="none" marker-end="url(#p-g)"/>

  <!-- generator: expanding trapezoid -->
  <path d="M 128 204 L 196 184 L 196 260 L 128 240 Z" fill="rgba(217,119,6,0.10)" stroke="var(--fig-amber, #d97706)" stroke-width="1.5"/>
  <text x="162" y="219" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fig-amber, #d97706)">G_θ</text>
  <text x="162" y="234" text-anchor="middle" font-size="10.5" fill="var(--fig-amber-2, #a35f05)">k → d</text>
  <path d="M 196 222 L 246 222" stroke="var(--fig-amber, #d97706)" stroke-width="1.6" fill="none" marker-end="url(#p-o)"/>
  <text x="221" y="214" text-anchor="middle" font-size="10" fill="var(--fig-amber, #d97706)">fake x̂</text>

  <!-- CRITIC -->
  <rect x="248" y="112" width="128" height="86" rx="10" fill="rgba(14,116,144,0.06)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6"/>
  <text x="312" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-teal, #0e7490)">Critic net</text>
  <text x="312" y="159" text-anchor="middle" font-size="11" fill="var(--fig-ink, #333)">raw output v ∈ ℝ</text>
  <text x="312" y="180" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #666)">weights ω · scalar out</text>
  <path d="M 246 57 L 262 57 L 262 110" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6" fill="none" marker-end="url(#p-t)"/>
  <path d="M 246 222 L 262 222 L 262 200" stroke="var(--fig-amber, #d97706)" stroke-width="1.6" fill="none" marker-end="url(#p-o)"/>

  <!-- activation gate -->
  <path d="M 376 155 L 410 155" stroke="var(--fig-muted-2, #888)" stroke-width="1.4" fill="none" marker-end="url(#p-g)"/>
  <rect x="412" y="122" width="126" height="66" rx="10" fill="var(--fig-paper, #fff)" stroke="var(--fig-muted-2, #888)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="475" y="145" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fig-ink-2, #444)">output activation</text>
  <text x="475" y="164" text-anchor="middle" font-size="11" fill="var(--fig-muted, #666)">T = g_f(v)</text>
  <text x="475" y="180" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">forces T ∈ dom f*</text>

  <!-- objective -->
  <path d="M 538 155 L 572 155" stroke="var(--fig-muted-2, #888)" stroke-width="1.4" fill="none" marker-end="url(#p-g)"/>
  <rect x="574" y="102" width="170" height="106" rx="10" fill="rgba(14,116,144,0.06)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6"/>
  <text x="659" y="126" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--fig-teal, #0e7490)">objective J(θ, ω)</text>
  <line x1="590" y1="136" x2="728" y2="136" stroke="rgba(14,116,144,0.25)"/>
  <text x="659" y="157" text-anchor="middle" font-size="11" fill="var(--fig-ink, #333)">mean of T over real</text>
  <text x="659" y="175" text-anchor="middle" font-size="11" fill="var(--fig-ink, #333)">−  mean of f*(T) over fake</text>
  <text x="659" y="196" text-anchor="middle" font-size="10" fill="var(--fig-muted, #777)">two sample averages. no densities.</text>

  <!-- min-max arrows -->
  <path d="M 700 100 L 700 66" stroke="var(--fig-teal, #0e7490)" stroke-width="2" fill="none" marker-end="url(#p-t)"/>
  <text x="690" y="76" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--fig-teal, #0e7490)">max over ω</text>
  <text x="690" y="90" text-anchor="end" font-size="10.5" fill="var(--fig-muted, #777)">tighten the bound</text>

  <path d="M 618 210 L 618 244" stroke="var(--fig-amber, #d97706)" stroke-width="2" fill="none" marker-end="url(#p-o)"/>
  <text x="630" y="234" font-size="10.5" font-weight="600" fill="var(--fig-amber, #d97706)">min over θ</text>
  <text x="630" y="248" font-size="10.5" fill="var(--fig-muted, #777)">shrink the divergence</text>

  <!-- gradient return path to G -->
  <path d="M 596 258 L 300 258 L 300 240 L 198 240" stroke="var(--fig-amber, #d97706)" stroke-width="1.4" fill="none"
        stroke-dasharray="6 4" marker-end="url(#p-o)"/>
  <text x="400" y="272" text-anchor="middle" font-size="10" fill="var(--fig-amber-2, #a35f05)">generator gradient travels back THROUGH the critic (critic frozen)</text>

  <line x1="18" y1="292" x2="742" y2="292" stroke="var(--fig-wash, #eee)"/>
  <text x="380" y="312" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">Everything computable is on this page: two bags of samples, one scalar network, one activation, one subtraction.</text>
</svg>
