<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, -apple-system, sans-serif">
  <!-- Left: surprisal curve -->
  <text x="190" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">Surprisal I(A) = −log P(A)</text>
  <line x1="70" y1="250" x2="330" y2="250" stroke="var(--fig-muted-2, #999)" stroke-width="1.2"/>
  <line x1="70" y1="250" x2="70" y2="60" stroke="var(--fig-muted-2, #999)" stroke-width="1.2"/>
  <path d="M 78 68 C 85 130, 100 180, 130 210 C 165 243, 250 248, 325 249" fill="none" stroke="var(--fig-teal, #0e7490)" stroke-width="2"/>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="var(--fig-muted, #777)">P(A) →</text>
  <text x="63" y="258" text-anchor="end" font-size="10.5" fill="var(--fig-muted, #777)">0</text>
  <text x="330" y="266" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">1</text>
  <text x="56" y="70" text-anchor="end" font-size="11" fill="var(--fig-muted, #777)">∞</text>
  <!-- annotations -->
  <circle cx="86" cy="98" r="3.5" fill="var(--fig-amber, #d97706)"/>
  <text x="98" y="92" font-size="10.5" fill="var(--fig-amber, #d97706)">rare event → huge surprise</text>
  <circle cx="318" cy="249" r="3.5" fill="var(--fig-teal, #0e7490)"/>
  <text paint-order="stroke" stroke="var(--fig-paper, #fff)" stroke-width="3.2" stroke-linejoin="round" x="312" y="236" text-anchor="end" font-size="10.5" fill="var(--fig-teal, #0e7490)">certain event → zero surprise</text>

  <!-- Right: P vs Q -->
  <text x="565" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">D_KL(P ‖ Q) = expected extra surprise</text>
  <line x1="410" y1="250" x2="720" y2="250" stroke="var(--fig-muted-2, #999)" stroke-width="1.2"/>
  <!-- P true -->
  <path d="M 415 248 C 450 244, 465 95, 510 92 C 552 90, 565 230, 600 244 C 630 250, 680 250, 715 249"
        fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="2"/>
  <!-- Q model -->
  <path d="M 415 249 C 470 247, 500 180, 565 145 C 620 118, 650 235, 715 247"
        fill="none" stroke="var(--fig-amber, #d97706)" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="500" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fig-teal, #0e7490)">P: true distribution</text>
  <text x="646" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fig-amber, #d97706)">Q: model</text>
  <text x="565" y="272" text-anchor="middle" font-size="11" fill="var(--fig-muted, #777)">x →</text>
  <text x="380" y="308" text-anchor="middle" font-size="11" fill="var(--fig-muted, #666)">Where P has mass but Q doesn't, log P/Q blows up, the penalty for a wrong model.</text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="var(--fig-muted, #666)">The −log turns multiplying probabilities into adding information.</text>
</svg>
