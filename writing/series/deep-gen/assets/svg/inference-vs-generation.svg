<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="ig-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/></marker>
    <marker id="ig-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-amber, #d97706)"/></marker>
    <g id="ig3" fill="none" stroke-width="7" stroke-linecap="round"><path d="M 5 5 Q 24 0 24 13 Q 24 23 12 23 Q 24 23 24 35 Q 24 48 3 43"/></g>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">after training you own two halves, and they are used for different jobs</text>

  <rect x="16" y="38" width="358" height="216" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-teal-bg, #dfe8ea)"/>
  <text x="34" y="58" font-size="11.5" font-weight="700" fill="var(--fig-teal, #0e7490)">inference: you have an x, you want its code</text>
  <rect x="36" y="76" width="56" height="56" rx="5" fill="var(--fig-ink, #111)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4"/>
  <g transform="translate(50,82)" stroke="var(--fig-paper, #fff)"><use href="#ig3"/></g>
  <text x="64" y="146" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">x_test</text>
  <path d="M 96 104 L 124 104" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6" fill="none" marker-end="url(#ig-t)"/>
  <path d="M 128 82 L 190 96 L 190 112 L 128 126 Z" fill="rgba(14,116,144,0.12)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6"/>
  <text x="159" y="108" text-anchor="middle" font-size="10.4" font-weight="700" fill="var(--fig-teal, #0e7490)">encoder</text>
  <text x="159" y="146" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">q_φ*</text>
  <path d="M 192 96 L 220 88" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4" fill="none" marker-end="url(#ig-t)"/>
  <path d="M 192 112 L 220 124" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4" fill="none" marker-end="url(#ig-t)"/>
  <rect x="224" y="72" width="128" height="34" rx="7" fill="var(--fig-paper, #fff)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5"/>
  <text x="288" y="93" text-anchor="middle" font-size="10.2" font-weight="600" fill="var(--fig-teal, #0e7490)">μ(x): just use this</text>
  <rect x="224" y="112" width="128" height="34" rx="7" fill="var(--fig-paper, #fff)" stroke="var(--fig-faint, #aaa)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="288" y="127" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">μ + σ⊙ε, if you</text>
  <text x="288" y="139" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">want it stochastic</text>
  <text x="34" y="180" font-size="10" fill="var(--fig-ink-2, #555)">The decoder is not involved. For a downstream classifier you</text>
  <text x="34" y="195" font-size="10" fill="var(--fig-ink-2, #555)">almost always take the mean: it is deterministic, and it is the</text>
  <text x="34" y="210" font-size="10" fill="var(--fig-ink-2, #555)">centre of what the encoder believes about this input.</text>
  <text x="34" y="232" font-size="10.5" font-style="italic" fill="var(--fig-teal, #0e7490)">784 pixel dimensions in, maybe 10 latent dimensions out.</text>

  <rect x="386" y="38" width="358" height="216" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-amber-bg, #e8e2d5)"/>
  <text x="404" y="58" font-size="11.5" font-weight="700" fill="var(--fig-amber, #d97706)">generation: you have no x at all</text>
  <rect x="410" y="86" width="104" height="36" rx="8" fill="var(--fig-wash, #f4f4f4)" stroke="var(--fig-muted-2, #888)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="462" y="109" text-anchor="middle" font-size="10.4" fill="var(--fig-ink-2, #555)">z ~ 𝒩(0, I)</text>
  <path d="M 518 104 L 546 104" stroke="var(--fig-amber, #d97706)" stroke-width="1.6" fill="none" marker-end="url(#ig-o)"/>
  <path d="M 550 88 L 612 74 L 612 134 L 550 120 Z" fill="rgba(217,119,6,0.12)" stroke="var(--fig-amber, #d97706)" stroke-width="1.6"/>
  <text x="581" y="108" text-anchor="middle" font-size="10.4" font-weight="700" fill="var(--fig-amber, #d97706)">decoder</text>
  <text x="581" y="150" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">p_θ*</text>
  <path d="M 614 104 L 642 104" stroke="var(--fig-amber, #d97706)" stroke-width="1.6" fill="none" marker-end="url(#ig-o)"/>
  <rect x="646" y="76" width="56" height="56" rx="5" fill="var(--fig-solid, #1c1c1c)" stroke="var(--fig-amber, #d97706)" stroke-width="1.4"/>
  <g transform="translate(660,82)" stroke="var(--fig-line, #e8e8e8)"><use href="#ig3"/></g>
  <text x="674" y="146" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">x̂: brand new</text>
  <text x="404" y="180" font-size="10" fill="var(--fig-ink-2, #555)">The encoder is not involved, and there is no input image</text>
  <text x="404" y="195" font-size="10" fill="var(--fig-ink-2, #555)">anywhere in this path. Reconstruction starts from an x you</text>
  <text x="404" y="210" font-size="10" fill="var(--fig-ink-2, #555)">already had; generation starts from noise and invents one.</text>
  <text x="404" y="232" font-size="10.5" font-style="italic" fill="var(--fig-amber, #d97706)">Whether this works at all is the question Figure 8.2 answers.</text>
  <text x="380" y="284" text-anchor="middle" font-size="10.6" fill="var(--fig-ink-2, #555)">Same two networks, trained together, then used entirely separately, one direction for representation, the other for synthesis.</text>
</svg>
