<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="pr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--fig-muted-2, #8a8a8a)"/></marker>
    <marker id="pr-t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--fig-teal, #0e7490)"/></marker>
  </defs>
  <text x="380" y="20" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #1a1a1a)" font-weight="700">reading concepts off the denoiser: 196,608 scalars in, one held-out AUC out</text>
  <rect x="24" y="48" width="92" height="44" rx="5" fill="none" stroke="var(--fig-line, #d8d8d8)" stroke-width="1"/>
  <text x="70" y="68" text-anchor="middle" font-size="10.5" fill="var(--fig-ink, #1a1a1a)" font-weight="600">x ∈ ℝᵈ</text>
  <text x="70" y="82" text-anchor="middle" font-size="8.6" fill="var(--fig-muted, #6a6a6a)">one activation</text>
  <path d="M 118 70 H 138" stroke="var(--fig-muted-2, #8a8a8a)" stroke-width="1.2" marker-end="url(#pr-a)"/>
  <rect x="140" y="48" width="84" height="44" rx="5" fill="none" stroke="var(--fig-amber, #d97706)" stroke-width="1"/>
  <text x="182" y="68" text-anchor="middle" font-size="9.6" fill="var(--fig-amber, #d97706)">noise to</text>
  <text x="182" y="81" text-anchor="middle" font-size="10.5" fill="var(--fig-amber, #d97706)" font-weight="700">t = 0.1</text>
  <path d="M 226 70 H 246" stroke="var(--fig-muted-2, #8a8a8a)" stroke-width="1.2" marker-end="url(#pr-a)"/>
  <rect x="248" y="42" width="150" height="56" rx="5" fill="none" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.4"/>
  <text x="323" y="60" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)" font-weight="700">GLP denoiser</text>
  <text x="323" y="73" text-anchor="middle" font-size="8.6" fill="var(--fig-muted, #6a6a6a)">one forward pass</text>
  <rect x="276" y="80" width="14" height="10" rx="2" fill="var(--fig-purple, #7c3aed)" opacity="0.28"/>
  <rect x="296" y="80" width="14" height="10" rx="2" fill="var(--fig-purple, #7c3aed)" opacity="0.28"/>
  <rect x="316" y="80" width="14" height="10" rx="2" fill="var(--fig-purple, #7c3aed)" opacity="0.9"/>
  <rect x="336" y="80" width="14" height="10" rx="2" fill="var(--fig-purple, #7c3aed)" opacity="0.9"/>
  <rect x="356" y="80" width="14" height="10" rx="2" fill="var(--fig-purple, #7c3aed)" opacity="0.28"/>
  <rect x="376" y="80" width="14" height="10" rx="2" fill="var(--fig-purple, #7c3aed)" opacity="0.28"/>
  <path d="M 400 70 H 420" stroke="var(--fig-muted-2, #8a8a8a)" stroke-width="1.2" marker-end="url(#pr-a)"/>
  <rect x="422" y="48" width="314" height="44" rx="5" fill="none" stroke="var(--fig-teal, #0e7490)" stroke-width="1"/>
  <text x="579" y="67" text-anchor="middle" font-size="10" fill="var(--fig-teal, #0e7490)" font-weight="600">tap every SwiGLU gate:  φᵢ(z) = SiLU(w₁ᵢ·z) · (w₂ᵢ·z)</text>
  <text x="579" y="81" text-anchor="middle" font-size="8.8" fill="var(--fig-muted, #6a6a6a)">one scalar per unit — the top ones cluster in the middle blocks</text>
  <path d="M 90 178 L 660 222 L 660 234 L 90 278 Z" fill="var(--fig-teal, #0e7490)" fill-opacity="0.09" stroke="var(--fig-teal, #0e7490)" stroke-width="1.2"/>
  <line x1="375" y1="200.0" x2="375" y2="256.0" stroke="var(--fig-teal, #0e7490)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <path d="M 662 228 H 682" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4" marker-end="url(#pr-t)"/>
  <text x="190" y="226" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #1a1a1a)" font-weight="700">196,608 units</text>
  <text x="190" y="240" text-anchor="middle" font-size="8.8" fill="var(--fig-muted, #6a6a6a)">98,304 on the 8B model</text>
  <text x="375" y="214" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #1a1a1a)" font-weight="700">512</text>
  <text x="375" y="227" text-anchor="middle" font-size="9" fill="var(--fig-muted, #6a6a6a)">candidates</text>
  <text x="686" y="224" text-anchor="start" font-size="11" fill="var(--fig-teal, #0e7490)" font-weight="700">1 neuron</text>
  <text x="686" y="237" text-anchor="start" font-size="9" fill="var(--fig-muted, #6a6a6a)">test AUC</text>
  <text x="232" y="154" text-anchor="middle" font-size="10" fill="var(--fig-ink-2, #4a4a4a)" font-weight="600">stage 1 — Gurnee heuristic, on train</text>
  <text x="232" y="168" text-anchor="middle" font-size="9.4" fill="var(--fig-muted, #6a6a6a)">|μ₁ − μ₀| / σ, keep the top K = 512</text>
  <text x="232" y="300" text-anchor="middle" font-size="9.2" fill="var(--fig-teal, #0e7490)">running K = all returns the same AUC, so the filter</text>
  <text x="232" y="312" text-anchor="middle" font-size="9.2" fill="var(--fig-teal, #0e7490)">is a speed-up and not a selection artifact</text>
  <text x="535" y="154" text-anchor="middle" font-size="10" fill="var(--fig-ink-2, #4a4a4a)" font-weight="600">stage 2 — 512 one-dimensional fits</text>
  <text x="535" y="168" text-anchor="middle" font-size="9.4" fill="var(--fig-muted, #6a6a6a)">L-BFGS, L₂ strength by 5-fold CV</text>
  <text x="535" y="300" text-anchor="middle" font-size="9.2" fill="var(--fig-teal, #0e7490)">the winner is picked on validation AUC and</text>
  <text x="535" y="312" text-anchor="middle" font-size="9.2" fill="var(--fig-teal, #0e7490)">scored on data it was never chosen against</text>
</svg>
