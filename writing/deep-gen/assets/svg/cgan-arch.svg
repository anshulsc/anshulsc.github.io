<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="cga-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/></marker>
    <marker id="cga-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-amber, #d97706)"/></marker>
    <marker id="cga-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-purple, #7c3aed)"/></marker>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">conditioning means the label goes into BOTH networks, that is the whole trick</text>

  <!-- generator path -->
  <rect x="20" y="46" width="94" height="38" rx="8" fill="var(--fig-wash, #f5f5f5)" stroke="var(--fig-faint, #aaa)"/>
  <text x="67" y="70" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #666)">z ~ N(0, I)</text>
  <rect x="20" y="102" width="94" height="38" rx="8" fill="rgba(124,58,237,0.10)" stroke="var(--fig-purple, #7c3aed)"/>
  <text x="67" y="120" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fig-purple, #7c3aed)">y = label</text>
  <text x="67" y="156" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">one-hot / embedding</text>
  <path d="M 114 65 L 148 82" stroke="var(--fig-muted-2, #888)" stroke-width="1.4" fill="none" marker-end="url(#cga-t)"/>
  <path d="M 114 121 L 148 104" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.4" fill="none" marker-end="url(#cga-p)"/>
  <rect x="150" y="76" width="76" height="34" rx="6" fill="var(--fig-paper, #fff)" stroke="var(--fig-muted-2, #888)" stroke-dasharray="4 3"/>
  <text x="188" y="97" text-anchor="middle" font-size="10" fill="var(--fig-muted, #666)">concat</text>
  <path d="M 226 93 L 258 93" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#cga-t)"/>
  <path d="M 260 68 L 330 54 L 330 132 L 260 118 Z" fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6"/>
  <text x="296" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--fig-teal, #0e7490)">G_θ(z, y)</text>
  <path d="M 330 93 L 366 93" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#cga-t)"/>
  <rect x="370" y="70" width="56" height="46" rx="4" fill="rgba(14,116,144,0.12)" stroke="var(--fig-teal, #0e7490)"/>
  <text x="398" y="98" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">x̂</text>
  <text x="392" y="134" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">a sample of class y</text>

  <!-- discriminator path -->
  <rect x="20" y="200" width="94" height="38" rx="8" fill="rgba(14,116,144,0.08)" stroke="var(--fig-teal, #0e7490)"/>
  <text x="67" y="218" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fig-teal, #0e7490)">real pair</text>
  <text x="67" y="232" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">(x, y) ~ p_XY</text>
  <rect x="20" y="252" width="94" height="38" rx="8" fill="rgba(217,119,6,0.08)" stroke="var(--fig-amber, #d97706)"/>
  <text x="67" y="270" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fig-amber, #d97706)">fake pair</text>
  <text x="67" y="284" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">(x̂, y)</text>
  <path d="M 114 219 L 152 234" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4" fill="none" marker-end="url(#cga-t)"/>
  <path d="M 114 271 L 152 256" stroke="var(--fig-amber, #d97706)" stroke-width="1.4" fill="none" marker-end="url(#cga-o)"/>
  <rect x="154" y="228" width="76" height="34" rx="6" fill="var(--fig-paper, #fff)" stroke="var(--fig-muted-2, #888)" stroke-dasharray="4 3"/>
  <text x="192" y="249" text-anchor="middle" font-size="10" fill="var(--fig-muted, #666)">concat</text>
  <path d="M 230 245 L 262 245" stroke="var(--fig-ink-2, #555)" stroke-width="1.5" fill="none" marker-end="url(#cga-t)"/>
  <path d="M 264 216 L 334 232 L 334 258 L 264 274 Z" fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6"/>
  <text x="299" y="249" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-teal, #0e7490)">D_ω(x, y)</text>
  <path d="M 334 245 L 370 245" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#cga-t)"/>
  <text x="378" y="242" font-size="10.5" fill="var(--fig-teal, #0e7490)">scalar in [0,1]</text>
  <text x="246" y="296" font-size="10.5" fill="var(--fig-muted-2, #999)">"is this a real x AND does it match y?"</text>
  <path d="M 428 93 C 456 96, 454 202, 380 232" stroke="var(--fig-amber, #d97706)" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#cga-o)"/>

  <!-- key insight box -->
  <rect x="470" y="60" width="274" height="106" rx="10" fill="rgba(124,58,237,0.05)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.2"/>
  <text x="607" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-purple, #7c3aed)">why D also needs y</text>
  <text x="486" y="102" font-size="10" fill="var(--fig-ink-2, #555)">If only G saw the label, G could ignore it and</text>
  <text x="486" y="117" font-size="10" fill="var(--fig-ink-2, #555)">still fool a label-blind D by emitting any</text>
  <text x="486" y="132" font-size="10" fill="var(--fig-ink-2, #555)">realistic image. Feeding y to D makes</text>
  <text x="486" y="147" font-size="10" fill="var(--fig-ink-2, #555)">"realistic but wrong class" a losing move.</text>
  <text x="486" y="161" font-size="10.5" font-style="italic" fill="var(--fig-purple, #7c3aed)">D judges the pair, not the image.</text>

  <rect x="470" y="192" width="274" height="106" rx="10" fill="var(--fig-wash, #fafafa)" stroke="var(--fig-line, #ddd)" stroke-width="1.2"/>
  <text x="607" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-ink-2, #555)">y at inference = a control switch</text>
  <text x="486" y="234" font-size="10" fill="var(--fig-ink-2, #555)">Training: every class appears, mixed together.</text>
  <text x="486" y="249" font-size="10" fill="var(--fig-ink-2, #555)">Inference: freeze θ, set y to the class you want,</text>
  <text x="486" y="264" font-size="10" fill="var(--fig-ink-2, #555)">draw a fresh z, and out comes that class.</text>
  <text x="486" y="284" font-size="10" fill="var(--fig-teal, #0e7490)">z chooses which sample · y chooses which kind</text>
</svg>
