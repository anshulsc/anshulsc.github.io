<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="cg-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/></marker>
    <marker id="cg-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-amber, #d97706)"/></marker>
    <marker id="cg-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-purple, #7c3aed)"/></marker>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">the discriminator is a teacher, not a judge, its job is to hand back a direction</text>

  <rect x="20" y="48" width="140" height="52" rx="10" fill="rgba(14,116,144,0.08)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4"/>
  <text x="90" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-teal, #0e7490)">real batch</text>
  <text x="90" y="85" text-anchor="middle" font-size="10" fill="var(--fig-ink-2, #555)">x ~ P_x   label 1</text>

  <rect x="20" y="176" width="140" height="52" rx="10" fill="rgba(217,119,6,0.08)" stroke="var(--fig-amber, #d97706)" stroke-width="1.4"/>
  <text x="90" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-amber, #d97706)">fake batch</text>
  <text x="90" y="213" text-anchor="middle" font-size="10" fill="var(--fig-ink-2, #555)">x̂ = g_θ(z)   label 0</text>

  <path d="M 160 74 L 236 108" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6" fill="none" marker-end="url(#cg-t)"/>
  <path d="M 160 202 L 236 168" stroke="var(--fig-amber, #d97706)" stroke-width="1.6" fill="none" marker-end="url(#cg-o)"/>

  <rect x="240" y="112" width="164" height="52" rx="10" fill="var(--fig-paper, #fff)" stroke="var(--fig-ink, #333)" stroke-width="1.8"/>
  <text x="322" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-ink, #333)">binary classifier D_ω</text>
  <text x="322" y="150" text-anchor="middle" font-size="10" fill="var(--fig-muted, #666)">ordinary cross-entropy</text>

  <path d="M 404 138 L 462 138" stroke="var(--fig-ink-2, #555)" stroke-width="1.6" fill="none" marker-end="url(#cg-t)"/>
  <rect x="466" y="112" width="130" height="52" rx="10" fill="rgba(14,116,144,0.06)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.4"/>
  <text x="531" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-teal, #0e7490)">D(x) ∈ [0, 1]</text>
  <text x="531" y="150" text-anchor="middle" font-size="10" fill="var(--fig-muted, #666)">"how real is this?"</text>

  <path d="M 596 138 L 652 138" stroke="var(--fig-ink-2, #555)" stroke-width="1.6" fill="none" marker-end="url(#cg-t)"/>
  <text x="700" y="126" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fig-ink-2, #555)">at the optimum</text>
  <text x="700" y="142" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">p/(p+q)</text>
  <text x="700" y="158" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">a density ratio</text>

  <path d="M 470 170 C 400 246, 220 250, 118 232" stroke="var(--fig-purple, #7c3aed)" stroke-width="2" fill="none" stroke-dasharray="7 4" marker-end="url(#cg-p)"/>
  <text x="330" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-purple, #7c3aed)">∇ of the classifier's score w.r.t. the input: "move the sample this way to look more real"</text>
  <text x="330" y="286" text-anchor="middle" font-size="10" fill="var(--fig-muted-2, #999)">this gradient, not the label, is the entire training signal for the generator</text>
</svg>
