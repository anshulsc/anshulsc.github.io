<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/>
    </marker>
    <marker id="arr5o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-amber, #d97706)"/>
    </marker>
  </defs>

  <!-- latent z -->
  <rect x="30" y="45" width="185" height="130" rx="12" fill="var(--fig-wash, #fafafa)" stroke="var(--fig-faint, #bbb)" stroke-width="1.3"/>
  <text x="122" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-ink, #333)">Simple latent z ~ 𝒩(0, I)</text>
  <line x1="48" y1="150" x2="198" y2="150" stroke="var(--fig-muted-2, #999)" stroke-width="1.1"/>
  <path d="M 52 148 C 85 145, 95 75, 123 75 C 151 75, 161 145, 194 148" fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.7"/>
  <text x="122" y="168" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #888)">unimodal, easy to sample</text>

  <!-- network -->
  <path d="M 215 110 L 262 110" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#arr5)"/>
  <rect x="265" y="60" width="150" height="100" rx="12" fill="rgba(14,116,144,0.06)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5"/>
  <text x="340" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fig-teal, #0e7490)" font-family="Georgia, serif" font-style="italic">x = g_θ(z)</text>
  <text x="340" y="122" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">neural network warps</text>
  <text x="340" y="136" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">the simple density</text>
  <path d="M 415 110 L 462 110" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#arr5)"/>

  <!-- model density -->
  <rect x="465" y="45" width="265" height="130" rx="12" fill="var(--fig-wash, #fafafa)" stroke="var(--fig-faint, #bbb)" stroke-width="1.3"/>
  <text x="597" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-teal, #0e7490)">Model density p_θ(x)</text>
  <line x1="483" y1="150" x2="713" y2="150" stroke="var(--fig-muted-2, #999)" stroke-width="1.1"/>
  <path d="M 487 148 C 512 145, 520 90, 543 88 C 563 87, 568 132, 585 132 C 602 132, 610 70, 632 68 C 655 67, 668 140, 683 143 C 695 145, 700 147, 709 148"
        fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.7"/>
  <text x="597" y="168" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #888)">multi-modal, matches complex data</text>

  <!-- true density -->
  <rect x="465" y="215" width="265" height="120" rx="12" fill="var(--fig-paper, #fff)" stroke="var(--fig-amber, #d97706)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="597" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-amber, #d97706)">True density p&#8339;(x), unknown</text>
  <line x1="483" y1="310" x2="713" y2="310" stroke="var(--fig-muted-2, #999)" stroke-width="1.1"/>
  <path d="M 487 308 C 515 305, 525 245, 550 243 C 572 242, 576 295, 594 295 C 612 295, 618 232, 640 230 C 662 229, 675 300, 690 303 C 700 305, 704 307, 709 308"
        fill="rgba(217,119,6,0.08)" stroke="var(--fig-amber, #d97706)" stroke-width="1.6"/>
  <text x="597" y="328" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #888)">we only ever see samples from it</text>

  <!-- divergence arrow -->
  <path d="M 452 250 C 380 250, 350 200, 348 168" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#arr5o)"/>
  <rect x="180" y="235" width="270" height="66" rx="12" fill="rgba(217,119,6,0.05)" stroke="var(--fig-amber, #d97706)" stroke-width="1.4"/>
  <text x="315" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-amber, #d97706)" font-family="Georgia, serif" font-style="italic">θ* = argmin D(p&#8339; ‖ p_θ)</text>
  <text x="315" y="284" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #666)">training = pulling the model toward the data</text>
</svg>
