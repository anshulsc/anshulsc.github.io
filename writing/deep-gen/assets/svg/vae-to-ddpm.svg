<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="vd-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/></marker>
  <marker id="vd-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-amber, #d97706)"/></marker></defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">a DDPM is a VAE with three restrictions bolted on</text>

  <rect x="16" y="38" width="728" height="86" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-teal-bg, #dfe8ea)"/>
  <text x="34" y="58" font-size="11" font-weight="700" fill="var(--fig-teal, #0e7490)">standard VAE: one latent, compressed, learned</text>
  <rect x="150" y="70" width="52" height="40" rx="5" fill="rgba(14,116,144,0.14)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
  <text x="176" y="95" text-anchor="middle" font-size="10.4" fill="var(--fig-teal, #0e7490)">x</text>
  <path d="M 206 90 L 250 90" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6" fill="none" marker-end="url(#vd-t)"/>
  <text x="228" y="83" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">learned</text>
  <rect x="254" y="78" width="30" height="24" rx="4" fill="rgba(124,58,237,0.2)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
  <text x="269" y="95" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">z</text>
  <path d="M 288 90 L 332 90" stroke="var(--fig-amber, #d97706)" stroke-width="1.6" fill="none" marker-end="url(#vd-o)"/>
  <rect x="336" y="70" width="52" height="40" rx="5" fill="rgba(217,119,6,0.14)" stroke="var(--fig-amber, #d97706)" stroke-width="1.3"/>
  <text x="362" y="95" text-anchor="middle" font-size="10.4" fill="var(--fig-amber, #d97706)">x̂</text>
  <text x="420" y="86" font-size="10.5" fill="var(--fig-muted-2, #999)">one hop each way · z is a bottleneck · both directions learned</text>

  <rect x="16" y="134" width="728" height="96" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-amber-bg, #e8e2d5)"/>
  <text x="34" y="154" font-size="11" font-weight="700" fill="var(--fig-amber, #d97706)">DDPM: a chain, same size throughout, only one direction learned</text>
  <g>
    <rect x="44" y="170" width="42" height="42" rx="4" fill="rgba(14,116,144,0.16)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
    <text x="65" y="196" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">x₀</text>
    <rect x="146" y="170" width="42" height="42" rx="4" fill="rgba(14,116,144,0.12)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.2"/>
    <text x="167" y="196" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">x₁</text>
    <rect x="248" y="170" width="42" height="42" rx="4" fill="rgba(14,116,144,0.08)" stroke="var(--fig-muted-2, #999)" stroke-width="1.2"/>
    <text x="269" y="196" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">x₂</text>
    <text x="330" y="196" text-anchor="middle" font-size="12" fill="var(--fig-muted-2, #999)">…</text>
    <rect x="372" y="170" width="42" height="42" rx="4" fill="rgba(120,120,120,0.18)" stroke="var(--fig-muted-2, #999)" stroke-width="1.2"/>
    <text x="393" y="196" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">x_T</text>
  </g>
  <path d="M 90 180 L 142 180" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#vd-t)"/>
  <path d="M 192 180 L 244 180" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#vd-t)"/>
  <path d="M 294 180 L 316 180" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#vd-t)"/>
  <path d="M 346 180 L 368 180" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#vd-t)"/>
  <text x="240" y="166" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">forward q: fixed, just adds noise</text>
  <path d="M 368 204 L 346 204" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#vd-o)"/>
  <path d="M 316 204 L 294 204" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#vd-o)"/>
  <path d="M 244 204 L 192 204" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#vd-o)"/>
  <path d="M 142 204 L 90 204" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#vd-o)"/>
  <text x="240" y="224" text-anchor="middle" font-size="10.5" fill="var(--fig-amber, #d97706)">reverse p_θ: the only thing a network learns</text>
  <text x="440" y="180" font-size="10.5" fill="var(--fig-muted-2, #999)">every box is the same size as x₀, no bottleneck anywhere</text>
  <text x="440" y="196" font-size="10.5" fill="var(--fig-muted-2, #999)">the forward arrows have no parameters at all</text>
  <text x="440" y="212" font-size="10.5" fill="var(--fig-muted-2, #999)">x_T is 𝒩(0, I) by construction, not by regularisation</text>

  <rect x="16" y="242" width="235" height="62" rx="9" fill="rgba(14,116,144,0.05)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.1"/>
  <text x="133" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-teal, #0e7490)">1 · hierarchy</text>
  <text x="133" y="277" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">many latents in a chain,</text>
  <text x="133" y="291" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">not one</text>

  <rect x="262" y="242" width="235" height="62" rx="9" fill="rgba(14,116,144,0.05)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.1"/>
  <text x="379" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-teal, #0e7490)">2 · no bottleneck</text>
  <text x="379" y="277" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">dim(x_t) = dim(x₀) for</text>
  <text x="379" y="291" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">every t</text>

  <rect x="508" y="242" width="236" height="62" rx="9" fill="rgba(14,116,144,0.05)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.1"/>
  <text x="626" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-teal, #0e7490)">3 · fixed encoder</text>
  <text x="626" y="277" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">q has no parameters, so</text>
  <text x="626" y="291" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">there is nothing to collapse</text>
</svg>
