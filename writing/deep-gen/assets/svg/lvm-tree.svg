<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 800 320" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="lt-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-teal, #0e7490)"/></marker></defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">what the hidden variable is decides what the model is for</text>

  <rect x="280" y="40" width="200" height="42" rx="10" fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.6"/>
  <text x="380" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--fig-teal, #0e7490)">latent variable model</text>
  <text x="380" y="75" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-2, #555)">P_θ(x) = ∫ P_θ(x, z) dz</text>

  <path d="M 340 84 L 200 116" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#lt-t)"/>
  <path d="M 420 84 L 560 116" stroke="var(--fig-teal, #0e7490)" stroke-width="1.5" fill="none" marker-end="url(#lt-t)"/>

  <rect x="60" y="122" width="284" height="164" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-teal-bg, #dfe8ea)"/>
  <text x="202" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-teal, #0e7490)">discrete Z ∈ {1, …, M}</text>
  <text x="202" y="160" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">P(z | x) is a soft cluster assignment</text>
  <g>
    <circle cx="120" cy="196" r="24" fill="rgba(14,116,144,0.13)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
    <circle cx="188" cy="216" r="20" fill="rgba(217,119,6,0.13)" stroke="var(--fig-amber, #d97706)" stroke-width="1.3"/>
    <circle cx="252" cy="192" r="26" fill="rgba(124,58,237,0.13)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
    <g fill="var(--fig-ink-2, #555)"><circle cx="112" cy="190" r="2"/><circle cx="126" cy="200" r="2"/><circle cx="118" cy="206" r="2"/>
    <circle cx="184" cy="212" r="2"/><circle cx="194" cy="220" r="2"/>
    <circle cx="246" cy="186" r="2"/><circle cx="258" cy="196" r="2"/><circle cx="250" cy="202" r="2"/></g>
  </g>
  <text x="202" y="252" text-anchor="middle" font-size="10.4" font-weight="600" fill="var(--fig-teal, #0e7490)">clustering</text>
  <text x="202" y="268" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">GMMs; K-means is the hard-assignment case</text>

  <rect x="416" y="122" width="284" height="164" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-amber-bg, #e8e2d5)"/>
  <text x="558" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-amber, #d97706)">continuous Z ∈ ℝᴷ</text>
  <text x="558" y="160" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">z | x is a compressed code for x</text>
  <rect x="440" y="178" width="46" height="46" rx="4" fill="rgba(14,116,144,0.14)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
  <path d="M 492 201 L 520 201" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#lt-t)"/>
  <rect x="524" y="190" width="16" height="22" rx="3" fill="rgba(217,119,6,0.25)" stroke="var(--fig-amber, #d97706)" stroke-width="1.3"/>
  <path d="M 546 201 L 574 201" stroke="var(--fig-amber, #d97706)" stroke-width="1.5" fill="none" marker-end="url(#lt-t)"/>
  <rect x="578" y="178" width="46" height="46" rx="4" fill="rgba(14,116,144,0.14)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
  <text x="532" y="182" text-anchor="middle" font-size="10.5" fill="var(--fig-amber, #d97706)">z</text>
  <text x="558" y="252" text-anchor="middle" font-size="10.4" font-weight="600" fill="var(--fig-amber, #d97706)">representation learning</text>
  <text x="558" y="268" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #777)">autoencoders, VAEs</text>

  <text x="380" y="308" text-anchor="middle" font-size="10.6" fill="var(--fig-ink-2, #555)">A GAN learns only the map from noise to data. A latent variable model also gives you, for each x, the z that explains it, which is what makes the code reusable.</text>
</svg>
