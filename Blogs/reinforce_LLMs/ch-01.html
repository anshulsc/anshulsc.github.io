*These notes are about reasoning LLMs, and this chapter is the argument for why reinforcement learning is the tool for that job: it turns a model which answers into a model which works something out. Everything later — bandits, Bellman, PPO, GRPO — builds on the vocabulary set up here.*

---

## 1. Three Paradigms of Machine Learning

| Feature | Supervised Learning | Unsupervised Learning | Reinforcement Learning |
| :--- | :--- | :--- | :--- |
| **Data Type** | Labeled data (input-output pairs) | Unlabeled data | No predefined labels; interactive data |
| **Primary Source** | Human-curated datasets | Raw, unstructured datasets | Active interaction with an environment |
| **Objective** | Generalize/extrapolate to unseen data | Find hidden structures/patterns within data | Learn how to act to maximize a reward signal |
| **Example** | Classifying brain MRIs as *malignant* or *benign*. | Clustering *Iris* flower species; Netflix/YouTube recommendations. | Game-playing agents (Chess, Tic-Tac-Toe); robotics. |

The distinction that matters is the last column. An RL agent learns from the **consequences of its decisions** rather than from being told what the correct action was. Trial and error, not labeled examples.

---

## 2. Core Characteristics

* **Learning by Trial and Error**: No teacher provides correct answers. The agent acts, observes what happened, and adjusts. That loop is the only source of information it ever gets.
* **Biological Relevance**: RL is the closest thing in computer science to how humans and animals actually learn, which is why all four examples in §3 are creatures rather than programs.
* **Historical Context (1960s–1980s)**: Early AI research classified RL-style approaches as **weak methods**, on the prevailing belief that performance came from the volume of human-provided training data. RL is the standing argument that it comes from interaction instead.

---

## 3. Real-Life Examples

Four examples, all with the same three moving parts: something that acts, something it acts on, and something it is trying to achieve. §4 gives those parts their names.

### I. A Master Chess Player
* Two concurrent cognitive processes:
  1. **Planning**: Anticipating moves and counter-moves, calculating lines several steps ahead.
  2. **Intuitive Judgments**: Assessing how good a board position is from experience rather than from calculation.
* The second is the harder one to explain, and the one RL is actually about.

### II. A Gazelle Calf
* A newborn gazelle struggles to stand, and half an hour later can run at 36 km/h.
* There is no database of labeled "how to run" examples anywhere in that process. It adapts its motor control through physical feedback, and fast enough that the usual complaint about RL being sample-inefficient deserves some suspicion.

### III. A Mobile Robot (e.g. Roomba)
* **The decision**: Should the robot head to a new room and collect more trash, or return to its dock and recharge?
* **The trade-off**: Immediate reward (cleaning) against staying alive to collect any reward at all.

### IV. Phil Preparing Breakfast
* A sequence of sub-actions: walk to cupboard → open it → select cereal → reach → grasp → retrieve → get plate → find spoon.
* Each small physical action serves an immediate sub-goal, and every sub-goal serves the one at the end, which is breakfast.

---

## 4. The Unified Structure of RL Problems

<figure><img src="assets/svg/agent-env-loop.svg?v=2" alt="Agent-Environment Loop" style="max-width: 550px;"><figcaption>Figure 1.1: The Agent-Environment Interaction Loop</figcaption></figure>

*The loop is sequential. The environment hands the agent a state $S_t$ and a reward $R_t$, the agent responds with an action $A_t$, and that action changes which state the environment is in next.*

1. **Agent**: The thing taking actions. The chess player, the gazelle, the robot, Phil.
2. **Environment**: Everything outside the agent's decision-making core.
   * *Note on boundaries*: The boundary is not the physical one you would guess. A robot's battery level and Phil's memories both sit on the environment side of the line. The test is not what is inside the body, it is what the agent can change directly by choosing. Battery level is something decisions are made *from*, not something a decision sets.
3. **Goal**: Winning the game, escaping the predator, collecting trash, getting breakfast.

---

## 5. The Four Elements of an RL System

1. **Policy** ($\pi$):
   * *Informal*: How the agent behaves at any given moment.
   * *Formal*: A mapping from perceived states of the environment to the actions to take in those states.

2. **Reward Signal** ($R$):
   * The immediate goal. At each time step the environment hands the agent a single number.
   * The agent's only objective is to maximize the cumulative total over the long run.
   * *Analogy*: Pleasure and pain in biological systems. Touching a boiling pot returns a sharp negative reward, and the lesson lands in one trial.

3. **Value Function** ($V$):
   * *Reward vs. value*: Reward is what is good *immediately*. Value is what is good in the *long run*.
   * The value of a state is the total reward the agent can expect to accumulate from that state onward.
   * *Tournament analogy*: A strong player who loses the first two of fourteen games has collected almost no reward, and is still in an excellent position. Low reward, high value.
   * This split between reward and value is the idea everything after this is built on. Ch.3, §10 turns it into the Bellman equation.

4. **Model of the Environment** *(optional)*:
   * A model predicts how the environment will respond, which lets the agent plan instead of acting and finding out.
   * **Model-Based RL** uses one. **Model-Free RL** does not, and learns purely from what happens. Most of what follows is model-free.

---

## 6. Case Study: Tic-Tac-Toe

All four elements at once, on a problem small enough to hold in your head. The agent plays 'X' against an opponent playing 'O', with no model of how that opponent chooses.

### Key Definitions
* **State**: Any board configuration of X's and O's on the 3×3 grid.
* **Policy**: The rule deciding which move to make from a given board.

### The Value Function Table
A lookup table mapping every board state to the estimated probability of winning from it.

* **Winning States** (three X's in a row): Value = $1.0$
* **Losing States** (three O's in a row): Value = $0.0$
* **Draw States**: Value = $0.5$
* **Initial/Intermediate States**: Initialized to $0.5$ (neutral)

Note what those numbers mean. The value here *is* a probability, which is a convenience of this particular problem rather than a general fact about value functions.

### Action Selection: Exploitation vs. Exploration
1. **Exploitation (Greedy Move)**: Look up the value of every legal move's resulting state and take the highest, $0.6$ over $0.4$.
2. **Exploration (Exploratory Move)**: Occasionally move at random instead, which is the only way the agent ever evaluates a state its current estimates tell it to avoid.

That tension is the whole subject of Ch.2, §3.

### Updating Value Estimates ("Backing Up")
When the agent moves greedily from state $S$ to successor state $S'$:

$$V(S) \leftarrow V(S) + \alpha \left[ V(S') - V(S) \right]$$

Where:
* $V(S)$: current value of the earlier state
* $V(S')$: value of the successor state
* $\alpha$: step-size parameter (learning rate), a small positive fraction

#### Worked Example
* Current: $V(S) = 0.8$, Successor: $V(S') = 0.9$, Step-size: $\alpha = 0.01$

$$V(S) \leftarrow 0.8 + 0.01 \times (0.9 - 0.8) = 0.8 + 0.001 = 0.801$$

The earlier state's value shifts slightly toward the later one's. This is called **backing up**, and repeated over many games it drags the estimates toward the true winning probabilities.

The thing to notice is where the learning signal came from. Nothing here waited for the game to end. The estimate at $S$ was corrected using another estimate, the one at $S'$, and that is the whole trick of **temporal difference learning** (Ch.5, §2), derived properly later.

---

*Tic-tac-toe had one kind of situation: look at the board, pick a move. The board did most of the work, because it told the agent everything about where it stood. What happens when there is no board, only a row of levers and no idea which one pays best? That is the multi-arm bandit problem, and it is Chapter 2.*
