*The tic-tac-toe agent in Chapter 1 had to choose between the greedy move and a random one, and that choice was buried under everything else the game was doing. The multi-arm bandit strips away states, transitions and planning until only that choice is left — the same one that reappears in ε-greedy SARSA (Ch.5, §3) and PPO's entropy bonus (Ch.6, §8).*

---

## 1. Defining the Bandit Problem

### The One-Armed Bandit
A slot machine. Pull the lever, occasionally get a payout, lose money on average. The name is a joke about being robbed slowly.

### The Multi-Arm Bandit ($k$-Armed Bandit)
Now imagine $k$ different levers, each with its own unknown reward distribution.

* **The Setup**: $k$ levers, each with a stationary probability distribution of rewards.
* **The Core Problem**: You do not know any of those underlying distributions.
* **The Goal**: Maximize total expected reward over $T$ time steps.

The word *stationary* is doing quiet work there. The distributions never drift, so anything you learn about a lever stays true, and the only difficulty is that you have not yet learned it.

---

## 2. Action-Value Methods

### Mathematical Definitions
Let $a$ denote pulling a specific lever.

* **True value** ($q_*(a)$): the actual expected reward. Objective, fixed, and hidden from you:
  $$q_*(a) = \mathbb{E}[R_t \mid A_t = a]$$

* **Estimated value** ($Q_t(a)$): your estimate at time $t$. The aim is $Q_t(a) \approx q_*(a)$.

### The Sample-Average Method
Average the rewards actually received whenever $a$ was chosen:

$$Q_t(a) = \frac{\sum_{i=1}^{t-1} R_i \cdot \mathbb{I}(A_i = a)}{\sum_{i=1}^{t-1} \mathbb{I}(A_i = a)}$$

Where $\mathbb{I}(\text{predicate})$ is 1 if true and 0 otherwise, so the denominator is $N_t(a)$, the number of times $a$ was chosen before $t$. If $N_t(a) = 0$ the estimate is undefined and gets a default, usually $0$.

By the **law of large numbers**, the estimate converges as the count grows:
$$\lim_{N_t(a) \to \infty} Q_t(a) = q_*(a)$$

That guarantee is the reason exploration is not optional. It only applies to arms you actually pull, so an arm you stop sampling keeps whatever wrong estimate it happened to get.

---

## 3. The Exploration vs. Exploitation Dilemma

A 4-armed bandit, with current estimates:

| Action ($a$) | Estimated Value ($Q_t(a)$) |
|---|---|
| Action 1 | $Q_t(1) = 1.5$ |
| Action 2 | $Q_t(2) = 3.0$ |
| Action 3 | $Q_t(3) = 2.5$ |
| Action 4 | $Q_t(4) = 2.0$ |

### Exploitation (Greedy Choice)
* Pick **Action 2** ($Q_t(2) = 3.0$), the best thing the current estimates know about.
* Maximizes immediate reward, and it is exactly right given the information available.

### Exploration (Non-Greedy Choice)
* Pick Action 1, 3, or 4.
* Gives up expected reward now in exchange for a better estimate.

The case for exploring is the one the table cannot show you. Suppose Action 3 truly has $q_*(3) = 5.0$ and simply drew badly on its first few pulls. Nothing in the estimates flags this, the greedy policy will never pull it again, and the error is permanent. This is the tic-tac-toe tension from Ch.1, §6 with everything else removed.

---

## 4. The ε-Greedy Algorithm

The simplest thing that works:

* With probability $\epsilon$ (small, say $0.01$ or $0.1$), pick uniformly at random among all $k$ actions.
* Otherwise pick greedily, $A_t = \operatorname{argmax}_a Q_t(a)$.

Because the random branch can select any arm, every arm gets pulled infinitely often in the limit, which is precisely the condition §2 needed for convergence. That is the entire justification for the algorithm, and $\epsilon$ just sets the price paid for it: a fraction $\epsilon$ of steps spent on actions believed to be worse.

The same rule comes back in Monte Carlo control (Ch.5, §1), SARSA (Ch.5, §3) and semi-gradient SARSA (Ch.5, §4).

## 5. Case Study: 10-Armed Testbed

### Simulation Design
* **Arms ($k$)**: $10$
* **True Values**: $q_*(a) \sim \mathcal{N}(0, 1)$, drawn once per run
* **Reward Generation**: $R_t \sim \mathcal{N}(q_*(A_t), 1)$, the true value plus noise

The noise is the point of the design. A single pull says almost nothing about an arm, so the agent is forced to sample repeatedly, and results are averaged over 2000 independent runs to stop one lucky draw from deciding the answer.

### Python Implementation

```python
import numpy as np
import matplotlib.pyplot as plt

# Configuration
n_bandits = 10         # Number of arms (k)
n_steps = 1000         # Number of plays per run
n_tasks = 2000         # Independent runs to average over
epsilons = [0, 0.1, 0.01]

# Results storage
average_rewards = np.zeros((n_steps, len(epsilons)))

for i, epsilon in enumerate(epsilons):
    print(f"Running simulation for epsilon = {epsilon}...")
    task_rewards = np.zeros((n_tasks, n_steps))
    
    for task in range(n_tasks):
        # 1. Initialize true values q_*(a)
        q_true = np.random.normal(0, 1, n_bandits)
        
        # 2. Initialize estimates Q(a) and counts N(a)
        q_est = np.zeros(n_bandits)
        action_counts = np.zeros(n_bandits)
        
        for step in range(n_steps):
            # 3. ε-greedy action selection
            if np.random.rand() < epsilon:
                action = np.random.choice(n_bandits)       # explore
            else:
                max_val = np.max(q_est)
                best_actions = np.where(q_est == max_val)[0]
                action = np.random.choice(best_actions)     # exploit (break ties randomly)
            
            # 4. Generate reward
            reward = np.random.normal(q_true[action], 1)
            
            # 5. Update estimate using sample-average
            action_counts[action] += 1
            q_est[action] += (reward - q_est[action]) / action_counts[action]
            
            task_rewards[task, step] = reward
            
    average_rewards[:, i] = np.mean(task_rewards, axis=0)

# Plot
plt.figure(figsize=(10, 6))
plt.plot(average_rewards[:, 0], label="ε = 0 (Greedy)", color='red')
plt.plot(average_rewards[:, 1], label="ε = 0.1", color='blue')
plt.plot(average_rewards[:, 2], label="ε = 0.01", color='green')
plt.xlabel("Steps"); plt.ylabel("Average Reward")
plt.title("ε-Greedy Performance on 10-Armed Bandit")
plt.legend(); plt.grid(True); plt.show()
```

The update on line 5 is worth reading twice. Writing the sample average incrementally as $Q \leftarrow Q + \frac{1}{N}(R - Q)$ means no stored history of rewards, just a running estimate and a count. That incremental form is the shape every update rule takes from here on.

### Performance Analysis

* **$\epsilon = 0$**: climbs fast, then flattens well below the others. It locks onto whichever arm looked best early and never revisits the decision.
* **$\epsilon = 0.1$**: finds the best arm quickly, then gives back 10% of its steps forever, so it plateaus below its own potential.
* **$\epsilon = 0.01$**: slowest to find the best arm and the highest at the end, because once it has found it, it plays it 99% of the time.

The ordering flips partway through the run, which is the useful part. Which $\epsilon$ is best depends on how long you intend to play, and no fixed value is right for every horizon.

---

## 6. Bandits vs. Full Reinforcement Learning

| Characteristic | Multi-Arm Bandit Problems | Full Reinforcement Learning |
|---|---|---|
| **State Space** | **Single State**: same situation regardless of action. | **Multiple States**: environment changes dynamically based on actions. |
| **Planning** | **No Planning**: actions only affect immediate rewards. | **Planning Required**: actions have long-term consequences (e.g., chess moves). |
| **Action Dependency** | **Independent**: feedback for an action is independent of previous choices. | **Sequential**: reward and next state depend on prior choices $a_{t-1}, a_{t-2}, \dots$ |

Every row comes from the same missing piece. A bandit has no state, so an action cannot change the situation you face next, which is what makes each pull independent and makes planning meaningless.

---

*Restoring that missing piece is Chapter 3. Once actions decide which situation comes next, an action is good or bad partly because of where it leaves you, and the machinery for saying that precisely is the Markov Decision Process.*
