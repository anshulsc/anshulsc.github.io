*Chapter 2 isolated the exploration tradeoff by removing everything else; this chapter puts it all back — multiple states, transitions between them, and actions whose consequences arrive later. The Markov Decision Process holds those pieces, and the Bellman equations at the end define what "optimal" actually means, which Chapters 4 to 7 spend their time approximating.*

---

## 1. The Agent-Environment Interface

The interaction between agent and environment is a step-by-step decision-making loop:

```
             Action (At)
        +----------------->
        |                |
   +----+---+        +---+----+
   |        |        |        |
   | Agent  |        | Environ|
   |        |        | -ment  |
   +----+---+        +---+----+
         ^                |
         |  Reward (Rt+1) |
         +----------------+
            State (St+1)
```

### The Discrete Time-Step Cycle
At discrete time steps $t = 0, 1, 2, 3, \dots$:
1. **State Observation** ($S_t$): Agent receives state $S_t \in \mathcal{S}$.
2. **Action Selection** ($A_t$): Based on $S_t$, agent selects $A_t \in \mathcal{A}(s)$.
3. **Transition and Reward** ($S_{t+1}, R_{t+1}$): Environment transitions to $S_{t+1} \in \mathcal{S}$ and sends reward $R_{t+1} \in \mathcal{R} \subset \mathbb{R}$.

Note the index on the reward. It is $R_{t+1}$, not $R_t$, because the reward arrives with the next state rather than alongside the action that earned it. The convention trips people up constantly and it matters when reading any of the sums below.

### Notation
* **Capital Letters** ($S_t, A_t, R_t$): Random variables at time $t$.
* **Lowercase Letters** ($s, a, r$): Specific values/realizations (e.g., $s \in \mathcal{S}$).

---

## 2. The Agent's Policy ($\pi$)

The policy formalizes the agent's decision-making strategy as a mapping from states to action probabilities:

$$\pi_t(a \mid s) = \mathbb{P}(A_t = a \mid S_t = s)$$

* If stationary (doesn't change over time): simply $\pi(a \mid s)$.
* Can be deterministic (maps state to a single action) or stochastic (maps state to a probability distribution over actions).

---

## 3. Goals and Rewards

### The Reward Hypothesis
> *All of what we mean by goals and purposes can be well-formulated as the maximization of the expected value of the cumulative sum of a received scalar signal (called reward).*

### Formulating Goals Correctly
Rewards must encode **what** to achieve, not **how** to achieve it.

* **Bad (Chess)**: Reward $+1$ for capturing the opponent's queen. The agent may sacrifice the game to capture a queen.
* **Good (Chess)**: Reward $+1$ for winning, $-1$ for losing, $0$ for a draw, which forces alignment with the actual objective.

The failure mode in the bad version is worth naming, because it comes back at the very end of these notes. Reward a proxy for the goal and you get a policy that maximizes the proxy. Ch.7, §4 is the same problem wearing a different hat, where the proxy is a learned reward model and the agent finds its blind spots.

---

## 4. Returns ($G_t$)

The agent's objective is to maximize **cumulative** reward rather than immediate reward. That cumulative measure is the **Return**.

### Episodic Tasks
Interaction breaks into self-contained episodes ending at a terminal state at time $T$:
$$G_t = R_{t+1} + R_{t+2} + R_{t+3} + \dots + R_T$$

### Continuing Tasks (Discounting)
If the task runs forever ($T = \infty$), the return could diverge. The fix is a **discount rate** $\gamma \in [0, 1)$:

$$G_t = R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+3} + \dots = \sum_{k=0}^{\infty} \gamma^k R_{t+k+1}$$

Discounting is doing two jobs at once here, and only one of them is philosophical. It keeps the sum finite, which is a mathematical necessity, and it expresses a preference for sooner rewards, which is a modelling choice. Most of the time the first job is the real reason.

#### Intuitive Analogy
₹100 today is worth more than ₹100 five years from now (inflation). Similarly:
* Immediate rewards: full face value ($1 \cdot R_{t+1}$)
* Future rewards: scaled down exponentially ($\gamma^k R_{t+k+1}$)

#### The Role of $\gamma$
* **$\gamma = 0$ (Myopic)**: Only cares about immediate reward $R_{t+1}$. Ignores the future entirely.
* **$\gamma \to 1$ (Far-Sighted)**: Values future rewards almost as much as immediate ones, which encourages long-term planning.

---

## 5. The Markov Property

A state signal $S_t$ has the **Markov Property** if the current state contains everything needed to predict the future. How the agent got there is irrelevant.

### Mathematical Formulation
$$\mathbb{P}(R_{t+1} = r, S_{t+1} = s' \mid S_t = s, A_t = a) = \mathbb{P}(R_{t+1} = r, S_{t+1} = s' \mid S_t, A_t, R_t, S_{t-1}, \dots, S_0, A_0)$$

The current state and action are **sufficient** to describe transition dynamics.

### Examples

| Example | State Representation | Markovian? | Why |
| :--- | :--- | :--- | :--- |
| **Chess** | Current board configuration | **Yes** | Don't need move history to find the optimal next move. |
| **Physics** (Cannonball) | Position $p$ + velocity $v$ | **Yes** | Current $(p, v)$ determines trajectory. Previous path irrelevant. |
| **Conversations** | Last spoken sentence | **No** | Need entire conversation context for a coherent response. |
| **Draw Poker** | Cards in your hand | **No** | Need history of bets, discards, bluffing patterns. |

The two failures in that table are both repairable, and the repair is always the same: fold the missing history into the state. A conversation becomes Markovian if the state is the whole transcript rather than the last sentence, which is exactly the move Ch.7, §1 makes when it treats a growing token sequence as the state.

---

## 6. Finite Markov Decision Processes

An RL task with the Markov property is a **Markov Decision Process (MDP)**. If the state, action and reward spaces are all finite it is a **Finite MDP**.

The dynamics are governed by:
$$p(s', r \mid s, a) = \mathbb{P}(S_{t+1} = s', R_{t+1} = r \mid S_t = s, A_t = a)$$

Everything else in this chapter is derived from that one function, which is worth appreciating. Four numbers describe the entire world.

### State-Transition Probabilities
$$p(s' \mid s, a) = \sum_{r \in \mathcal{R}} p(s', r \mid s, a)$$

### Expected Rewards for State-Action Pairs
$$r(s, a) = \mathbb{E}[R_{t+1} \mid S_t = s, A_t = a] = \sum_{r \in \mathcal{R}} r \sum_{s' \in \mathcal{S}} p(s', r \mid s, a)$$

### Expected Rewards for State-Action-Next-State Triples
$$r(s, a, s') = \mathbb{E}[R_{t+1} \mid S_t = s, A_t = a, S_{t+1} = s'] = \sum_{r \in \mathcal{R}} r \frac{p(s', r \mid s, a)}{p(s' \mid s, a)}$$

---

## 7. Case Studies

### Case Study 1: Bioreactor Control
* **State**: Sensor readings (temperature, pressure, pH)
* **Action**: Control inputs (target temperature, stirring rate)
* **Reward**: Rate of chemical production

### Case Study 2: Pick-and-Place Robot Arm
* **State**: Joint angles ($\theta_1, \theta_2$) and angular velocities ($\omega_1, \omega_2$)
* **Action**: Voltages applied to motors ($V_1, V_2$)
* **Reward**: $+1$ per successful pick-and-place, $-0.02$ for jerky movements

Note that the second reward term is a *how*, not a *what*, which §3 just warned against. It is there because the *what* alone admits solutions that shake the arm to pieces, and this is the usual honest compromise rather than a violation of the rule.

### Case Study 3: Recycling Robot (Finite MDP)
An autonomous can-collecting robot with battery states {High, Low}:

*The state transition diagram models the robot's two energy levels as states (HIGH, LOW) and its choices as actions (Search, Wait, Recharge), with transition probabilities and immediate rewards on the arrows.*

#### Full Transition Table

| $s$ | $a$ | $s'$ | $p(s' \mid s, a)$ | $r(s, a, s')$ |
| :--- | :--- | :--- | :--- | :--- |
| high | search | high | $\alpha$ | $r_{\text{search}}$ |
| high | search | low | $1 - \alpha$ | $r_{\text{search}}$ |
| high | wait | high | $1$ | $r_{\text{wait}}$ |
| low | search | low | $\beta$ | $r_{\text{search}}$ |
| low | search | high (Rescue) | $1 - \beta$ | $-3$ |
| low | wait | low | $1$ | $r_{\text{wait}}$ |
| low | recharge | high | $1$ | $0$ |

The $-3$ on the rescue row is the only negative number in the table, and it is what makes the problem interesting. Without it, searching on a low battery is free and the optimal policy is trivial.

### Case Study 4: Cart-Pole
* **As Episodic Task**: Episode ends when $|\theta| > 15^\circ$ or $|p| > 2.4\text{m}$. Reward $+1$ per step balanced, so the return is the number of steps survived.
* **As Continuing Task**: $R = -1$ on failure, $0$ otherwise. The discounted return penalizes failures that arrive sooner more heavily than distant ones.

## 8. The State-Value Function $v_\pi(s)$

The **state-value function** under policy $\pi$:

$$v_\pi(s) = \mathbb{E}_\pi [G_t \mid S_t = s] = \mathbb{E}_\pi \left[ \sum_{k=0}^{\infty} \gamma^k R_{t+k+1} \;\middle|\; S_t = s \right]$$

* $v_\pi(s)$: Expected return starting from state $s$, following policy $\pi$ thereafter.
* $\mathbb{E}_\pi[\cdot]$: Expectation under policy $\pi$.

The subscript on the expectation is the part to hold onto. A value is never a property of a state alone, only of a state *and a policy*, and the same state has different values under different policies. Ch.4 spends its whole length exploiting that fact.

---

## 9. The Action-Value Function $q_\pi(s, a)$

$$q_\pi(s, a) = \mathbb{E}_\pi [G_t \mid S_t = s, A_t = a] = \mathbb{E}_\pi \left[ \sum_{k=0}^{\infty} \gamma^k R_{t+k+1} \;\middle|\; S_t = s, A_t = a \right]$$

### State-Value vs. Action-Value
* **$v_\pi(s)$**: How good is it to **be** in state $s$?
* **$q_\pi(s, a)$**: How good is it to **take action** $a$ from state $s$?

The difference looks cosmetic and is not. To act greedily on $v_\pi$ you must look one step ahead, and looking ahead requires knowing $p(s', r \mid s, a)$. Acting greedily on $q_\pi$ needs nothing but the table itself. That is precisely why model-free control (Ch.5, §1) learns $q$ rather than $v$.

---

## 10. The Bellman Equation for $v_\pi$

Value functions satisfy a recursive relationship: the value of the current state can be expressed in terms of its successors' values.

### Derivation

Start with the definition:
$$v_\pi(s) = \mathbb{E}_\pi [G_t \mid S_t = s]$$

Expand $G_t$ into immediate reward plus discounted future:
$$v_\pi(s) = \mathbb{E}_\pi [R_{t+1} + \gamma G_{t+1} \mid S_t = s]$$

Sum over all possible actions, next states, and rewards:
$$v_\pi(s) = \sum_{a} \pi(a \mid s) \sum_{s'} \sum_{r} p(s', r \mid s, a) \left[ r + \gamma \mathbb{E}_\pi [G_{t+1} \mid S_{t+1} = s'] \right]$$

Since $\mathbb{E}_\pi [G_{t+1} \mid S_{t+1} = s'] = v_\pi(s')$:

$$v_\pi(s) = \sum_{a} \pi(a \mid s) \sum_{s', r} p(s', r \mid s, a) \left[ r + \gamma v_\pi(s') \right]$$

That last substitution is the entire trick, and it is only legal because of the Markov property from §5. The expected return from $s'$ does not depend on how the agent reached $s'$, so it is the same $v_\pi(s')$ regardless of the path taken to get there.

### Component Breakdown
* $\pi(a \mid s)$: Policy, the probability of taking action $a$ in state $s$.
* $p(s', r \mid s, a)$: Transition dynamics, the probability of landing in $s'$ with reward $r$.
* $r$: Immediate reward.
* $\gamma v_\pi(s')$: Discounted value of the successor state.

### Backup Diagram
<figure><img src="assets/svg/bellman-backup.svg?v=2" alt="Bellman Backup Tree Diagram" style="max-width:400px;"><figcaption>Figure 3.2: Bellman Equation Backup Tree Diagram for $v_\pi(s)$</figcaption></figure>

*Reading the tree top down: a state node $s$, branching over actions $a$ weighted by $\pi(a \mid s)$ (black circles), each branching again over successor states $s'$ weighted by $p(s', r \mid s, a)$ (open circles) with reward $r$ collected on the way.*

The two layers of branching are the two sums in the equation, in order. Every backup diagram in the rest of these notes is a variation on this picture.

### Worked Example (3 actions, 6 successor states)

$$v_\pi(s) = \pi(a_1 \mid s) \big( p(s_1, r_1 \mid s, a_1)[r_1 + \gamma v_\pi(s_1)] + p(s_2, r_2 \mid s, a_1)[r_2 + \gamma v_\pi(s_2)] \big) + \text{Term 2} + \text{Term 3}$$

Each term sums over successor states reachable by that action, weighted by transition probabilities.

---

## 11. Optimal Value Functions

A policy $\pi$ is better than $\pi'$ if it is at least as good from every state:
$$\pi \geq \pi' \iff v_\pi(s) \geq v_{\pi'}(s) \quad \forall s \in \mathcal{S}$$

That "for all $s$" makes the ordering partial rather than total, so two policies can each be better somewhere and neither better overall. The remarkable fact is that a policy beating every other one from every state always exists anyway. There is always at least one **optimal policy** $\pi_*$.

### Optimal State-Value Function
$$v_*(s) = \max_{\pi} v_\pi(s) \quad \forall s \in \mathcal{S}$$

### Optimal Action-Value Function
$$q_*(s, a) = \max_{\pi} q_\pi(s, a) \quad \forall s \in \mathcal{S}, a \in \mathcal{A}(s)$$

The relationship:
$$v_*(s) = \max_{a \in \mathcal{A}(s)} q_*(s, a)$$

### The Bellman Optimality Equation

$$v_*(s) = \max_{a \in \mathcal{A}(s)} \sum_{s', r} p(s', r \mid s, a) \left[ r + \gamma v_*(s') \right]$$

One symbol changed. Where the standard Bellman equation averages over actions weighted by $\pi(a \mid s)$, this one takes the maximum, on the assumption that an optimal agent picks the best action rather than sampling. The consequence of that swap is larger than it looks: $\max$ is not linear, so this is no longer a system of linear equations and cannot be solved by matrix inversion. Ch.4 exists because of that one operator.

---

## 12. Worked Example: Recycling Robot Bellman Optimality Equations

Using the recycling robot from §7, written out explicitly.

### For state $s = \text{High}$:
The agent chooses Search or Wait, so take the max of the two:

$$v_*(\text{High}) = \max \begin{cases}
\alpha \left[ R_{\text{search}} + \gamma v_*(\text{High}) \right] + (1-\alpha) \left[ R_{\text{search}} + \gamma v_*(\text{Low}) \right], \\
R_{\text{wait}} + \gamma v_*(\text{High})
\end{cases}$$

### For state $s = \text{Low}$:
Three options now, so take the max of three:

$$v_*(\text{Low}) = \max \begin{cases}
\beta \left[ R_{\text{search}} + \gamma v_*(\text{Low}) \right] + (1-\beta) \left[ -3 + \gamma v_*(\text{High}) \right], \\
R_{\text{wait}} + \gamma v_*(\text{Low}), \\
\gamma v_*(\text{High})
\end{cases}$$

Notice that $v_*$ appears on both sides of both equations. They are not formulas you evaluate, they are constraints a solution has to satisfy, which is why solving them takes iteration.

### Convergent Values (via value iteration, Ch.4)
* $v_*(\text{High}) \approx 25.42$
* $v_*(\text{Low}) \approx 22.88$

Substituting these back shows which action attains the max in each state, and reading off those actions gives the **optimal policy** $\pi_*$. The values were never the goal; the policy hiding inside them was.

---

*So "optimal" now has a precise definition, and it is a fixed point of the Bellman optimality equation. Computing it is a separate problem. With the full model $p(s', r \mid s, a)$ in hand, dynamic programming solves it directly, which is Chapter 4. Without a model, the agent has to learn from experience instead, which is Chapter 5.*
