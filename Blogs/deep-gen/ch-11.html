## 23. StyleGAN and disentanglement

The lecture closes by returning to GANs for comparison, and two architectures are worth the detour because they make a point about latent structure that §20 left hanging.

[StyleGAN](https://arxiv.org/abs/1812.04948) (Karras et al., 2019) redesigns the generator around one observation: feeding the latent in at the bottom and letting it propagate is a bad way to get control. Four changes:

**A mapping network.** Instead of feeding $z \in \mathcal{Z}$ into the generator, pass it through an eight-layer MLP to get an intermediate code $w \in \mathcal{W}$, and feed *that* in. The argument for this is worth spelling out because it connects directly to §20. Sampling requires $z$ to have a fixed simple distribution, usually Gaussian. But the combinations of attributes present in real data are not distributed like a Gaussian — some combinations are common, some are rare, some (long hair on a face labelled male, in a biased dataset) may be nearly absent. Forcing the generator to map a spherical Gaussian onto that lumpy structure requires warping, and warping is precisely what entangles directions: to reach an under-represented region the generator must curve, and curvature means moving along one axis changes several attributes at once. The mapping network absorbs the warping, because $\mathcal{W}$ carries no distributional requirement at all — its distribution is whatever the MLP produces. The generator downstream then works in a space that is free to be flatter, and empirically it is.

That is also the honest answer to why $\mathcal{W}$ is more disentangled than $\mathcal{Z}$, and note the shape of the argument: disentanglement came from *removing* a distributional constraint. A flow cannot do this, because its latent is required by construction to be exactly Gaussian — the constraint is the model. That is a real structural advantage GANs have here, and it is the flip side of the exactness that flows buy.

**A learned constant input.** The synthesis network starts from a learned $4 \times 4 \times 512$ tensor rather than from the noise vector. All the input-dependent information arrives through the style pathway instead.

**AdaIN.** At each layer, feature maps are normalised and then re-scaled and re-shifted by parameters derived from $w$:

$$\text{AdaIN}(h_i, w) = y_{s,i}\, \frac{h_i - \mu(h_i)}{\sigma(h_i)} + y_{b,i}$$

Because this is applied at every resolution, and different resolutions carry different scales of structure, styles injected early control coarse attributes (pose, face shape) and styles injected late control fine ones (colour scheme, micro-texture). That is where the layer-wise control in the demos comes from.

**Noise injection.** Per-pixel Gaussian noise is added directly to feature maps at each layer, with a learned per-channel scale.

The noise deserves a moment because its role is easy to misread. Details like the exact curl of a strand of hair, the precise arrangement of freckles, and the pattern of skin pores are genuinely stochastic — no facial identity determines them, and any specific arrangement is as valid as any other. Without a source of per-pixel randomness the generator has to synthesise these from the style vector, which is global; the result is that every face gets essentially the same texture, applied in the same way, and the images look flat and painterly. Remove the noise inputs from a trained StyleGAN and this is exactly what you see: identity and pose are untouched, because those come from $w$, while fine stochastic detail becomes repetitive. The separation is the design working as intended — global structure in $w$, local stochasticity in the noise.

**Disentanglement, defined.** A latent space is *entangled* when moving along one coordinate changes several semantic attributes at once — a hair-colour slider that also shifts apparent age. It is *disentangled* when coordinates correspond to distinct, independently controllable factors. The practical target is the character-creator experience: one slider, one thing changes. §20's caution applies here too — disentanglement is encouraged architecturally, measured empirically, and not guaranteed by any objective.

## 24. Pix2Pix, and why the L1 term is there

[Pix2Pix](https://arxiv.org/abs/1611.07004) (Isola et al., 2017) is a conditional GAN for paired image translation — sketch to photograph, segmentation map to street scene, edges to product shot. Ch.5, §14 covered CycleGAN, which exists to remove Pix2Pix's requirement of aligned pairs; this is the paired case it was reacting to.

Both generator and discriminator see the conditioning image $x$, so the discriminator judges the *pair* $(x, y)$ rather than $y$ alone — that is what makes it conditional, and it is why the setup can enforce correspondence at all. And the objective adds a reconstruction term to the adversarial one:

$$G^* = \arg\min_G \max_D \; \mathcal{L}_{\text{cGAN}}(G, D) + \lambda\, \mathcal{L}_{L_1}(G), \qquad \mathcal{L}_{L_1}(G) = \mathbb{E}_{x,y}\big[\| y - G(x) \|_1\big]$$

Why both terms? Each fixes the other's failure.

*The adversarial term alone does not enforce correspondence.* The discriminator's job is to say whether a pair looks real. A generator that ignores the input sketch entirely and emits a perfectly photorealistic shoe of its own invention... would be caught, since the discriminator sees the pair. But the pressure is weak and indirect — it is a learned, noisy signal about joint plausibility, and in practice generators trained on the adversarial loss alone drift, hallucinating structure that has no basis in the input. The L1 term is a direct, dense, per-pixel instruction: match *this* target.

*The reconstruction term alone produces blur,* for exactly the reason in §21. Translation is one-to-many; many photographs are consistent with one sketch. A deterministic generator trained on a per-pixel loss converges to a summary statistic of that set. For L2 the minimiser is the conditional mean, and averaging sharp images gives a blurry one. This is why the paper uses L1 rather than L2: the minimiser of an L1 loss is the conditional *median*, and a median is less catastrophic than a mean — it picks a representative value rather than blending all of them — so L1 blurs less. It still blurs.

So the division of labour is by frequency. L1 gets the low frequencies right: global layout, colour, correspondence with the input. The adversarial loss supplies the high frequencies: crisp edges, plausible texture, the details that no averaged objective will ever produce. Pix2Pix's PatchGAN discriminator makes this explicit by judging local patches rather than whole images — its job is texture, since structure is already handled.

This is also the cleanest statement of why a conditional GAN beats an unconditional one for a task like segmentation-map-to-street-view. An unconditional GAN starts from noise and produces *some* street scene, with no way to demand that the car be where the segmentation map says a car is. Conditioning turns the map into a blueprint that both networks can see, so the layout becomes a constraint rather than a suggestion.

## 25. Choosing between them

The whole course, in one table.

| family | exact $p(x)$? | samples | training | latent | main drawback |
| :--- | :--- | :--- | :--- | :--- | :--- |
| KDE | yes, exact | poor | none needed | none | dies in high dimensions (§2) |
| VAE | no — ELBO lower bound | good, often soft | stable | yes, compressed | likelihood is a bound with an unknown gap |
| normalizing flow | **yes, exact and tractable** | very good | stable, plain MLE | yes, invertible, same size as data | latent dimension equals data dimension (§18) |
| GAN | no, none at all | outstanding | unstable minimax | yes, can be highly disentangled | no density; mode collapse |
| diffusion | no — variational bound | state of the art | very stable | yes, same size as data | many sequential steps to sample |

Two ways of using this table are worth rehearsing, because they are the questions that actually get asked.

**A GAN produces beautiful faces that all look nearly identical.** That is mode collapse, and Ch.4, §12 has the mechanism: the generator has found one region of data space the discriminator currently scores as real, and the minimax objective gives it no incentive to cover the rest — matching the whole distribution is not what the loss asks for, only fooling the current discriminator is. Note that this failure is invisible to any per-sample quality metric. Each image is excellent; the *distribution* is wrong. Flows cannot fail this way, because maximum likelihood (6) evaluates the model at every training point and a mode with no assigned density contributes $-\infty$.

**A medical imaging system needs realistic samples, exact likelihoods for flagging anomalous scans, and a meaningful latent for interpolating between disease states.** Walk the table. GANs are out on requirement two — no density in any form. KDE is out on requirement one, from §2's calculation. VAEs give a bound, not an exact likelihood, and if the number is being used for a clinical threshold then an unknown gap is not acceptable. Diffusion models give a bound too, and sampling is slow. Flows satisfy all three simultaneously, which is precisely the niche they were built for — and with §22's caveat attached in writing: the likelihood is exact, but a bare threshold on it is not a reliable OOD detector, so the anomaly component needs a corrected statistic rather than raw $\log p_\theta(x)$.

| training | (6), (7) | samples only → forward KL = MLE, needs $f$ fast; density only → reverse KL, needs $T$ fast |
| triangular Jacobian | (8) | $\mathcal{O}(d^3) \to \mathcal{O}(d)$; and Knothe–Rosenblatt says it costs no expressiveness |
| autoregressive / MAF | (9) | $x_j = \mu_j(x_{<j}) + e^{\alpha_j(x_{<j})} z_j$; density 1 pass, sampling $d$ passes |
| permutations | §15 | coordinate 1 is otherwise never conditioned on anything |
| affine coupling | (10) | freeze half; $\log\lvert\det J\rvert = \sum_j s_j$; both directions closed-form |
| multi-scale | §18 | reduces compute per dimension, **not** the number of dimensions |
| Glow 1×1 + LU | (11) | learned channel mixing; $\log\lvert\det W\rvert = \sum_i \log\lvert s_i\rvert$ |
| latent arithmetic | (12) | it is a difference of class-conditional means; the averaging cancels identity |
| the constraint | §18 | $\dim(z) = \dim(x)$, always, because a determinant needs a square matrix |

## 27. What I take away

The mathematics of flows is the smallest of any model in this course. One conservation law, applied in $d$ dimensions, plus the chain rule. There is no bound to be careful about, no adversary to stabilise, no noise schedule to tune. Objective (6) is the log-likelihood, written out in full, differentiated directly.

Everything hard about flows got pushed into architecture. Because the objective demands nothing, the network must supply everything: invertibility, a computable determinant, and enough expressiveness to bend a Gaussian into the distribution of natural images. That is why this chapter is mostly a catalogue of clever layers — triangular maps, coupling layers, monotone networks, sum-of-squares polynomials, LU-parameterised mixing matrices. Each is an answer to "what can I make invertible and still differentiate cheaply".

And the constraint that cannot be engineered around is the one that decided the field's direction. A flow cannot compress, because a determinant needs a square matrix. That single fact makes flows expensive on large images and left the door open for diffusion models, which gave up exactness and got sample quality in return.

Which is the pattern the whole course has been circling. GANs gave up the density for sample quality. VAEs gave up exactness for a bottleneck. Diffusion gave up speed for stability. Flows gave up the bottleneck for exactness. There is no model here that got something for nothing, and knowing precisely what each one traded away is the actual content of knowing them.
