<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="ct-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--fig-purple, #7c3aed)"/></marker></defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">you cannot concatenate a vector onto an image, so you tile it into channels</text>

  <!-- MLP case -->
  <rect x="16" y="36" width="356" height="106" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-line, #e2e2e2)"/>
  <text x="34" y="56" font-size="11" font-weight="700" fill="var(--fig-ink-2, #555)">in an MLP, just concatenate</text>
  <rect x="34" y="70" width="180" height="24" rx="4" fill="rgba(14,116,144,0.14)" stroke="var(--fig-teal, #0e7490)"/>
  <text x="124" y="87" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">flattened image, d_x</text>
  <rect x="216" y="70" width="70" height="24" rx="4" fill="rgba(124,58,237,0.16)" stroke="var(--fig-purple, #7c3aed)"/>
  <text x="251" y="87" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">y, d_y</text>
  <text x="34" y="115" font-size="10.5" fill="var(--fig-muted-2, #888)">one vector of length d_x + d_y goes into the first dense layer</text>
  <text x="34" y="131" font-size="10.5" fill="var(--fig-red, #c0392b)">…but flattening is exactly what DCGAN exists to avoid</text>

  <!-- CNN case -->
  <rect x="16" y="156" width="728" height="132" rx="10" fill="var(--fig-wash, #fcfcfc)" stroke="var(--fig-teal-bg, #dfe8ea)"/>
  <text x="34" y="176" font-size="11" font-weight="700" fill="var(--fig-teal, #0e7490)">in a CNN, broadcast y across every spatial position</text>

  <!-- feature map -->
  <g>
    <rect x="46" y="192" width="58" height="58" rx="3" fill="rgba(14,116,144,0.16)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
    <rect x="52" y="198" width="58" height="58" rx="3" fill="rgba(14,116,144,0.13)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
    <rect x="58" y="204" width="58" height="58" rx="3" fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
  </g>
  <text x="87" y="278" text-anchor="middle" font-size="10.5" fill="var(--fig-teal, #0e7490)">H × W × C</text>

  <text x="132" y="236" font-size="15" fill="var(--fig-muted-2, #888)">+</text>

  <!-- y vector -->
  <rect x="152" y="206" width="20" height="16" rx="2" fill="rgba(124,58,237,0.3)" stroke="var(--fig-purple, #7c3aed)"/>
  <rect x="152" y="224" width="20" height="16" rx="2" fill="rgba(124,58,237,0.08)" stroke="var(--fig-purple, #7c3aed)"/>
  <rect x="152" y="242" width="20" height="16" rx="2" fill="rgba(124,58,237,0.08)" stroke="var(--fig-purple, #7c3aed)"/>
  <text x="162" y="278" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">y, C_y</text>
  <text x="162" y="200" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">one-hot</text>

  <path d="M 182 232 L 220 232" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.5" fill="none" marker-end="url(#ct-p)"/>
  <text x="201" y="224" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">tile</text>

  <!-- tiled planes -->
  <g>
    <rect x="230" y="192" width="58" height="58" rx="3" fill="rgba(124,58,237,0.26)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
    <rect x="236" y="198" width="58" height="58" rx="3" fill="rgba(124,58,237,0.07)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
    <rect x="242" y="204" width="58" height="58" rx="3" fill="rgba(124,58,237,0.07)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
  </g>
  <text x="271" y="278" text-anchor="middle" font-size="10.5" fill="var(--fig-purple, #7c3aed)">H × W × C_y</text>
  <text x="271" y="188" text-anchor="middle" font-size="10.5" fill="var(--fig-muted-2, #999)">each plane constant</text>

  <text x="316" y="236" font-size="15" fill="var(--fig-muted-2, #888)">=</text>

  <!-- concatenated -->
  <g>
    <rect x="342" y="192" width="58" height="58" rx="3" fill="rgba(14,116,144,0.16)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
    <rect x="348" y="198" width="58" height="58" rx="3" fill="rgba(14,116,144,0.10)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.3"/>
    <rect x="354" y="204" width="58" height="58" rx="3" fill="rgba(124,58,237,0.22)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
    <rect x="360" y="210" width="58" height="58" rx="3" fill="rgba(124,58,237,0.10)" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.3"/>
  </g>
  <text x="384" y="284" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fig-ink-2, #444)">H × W × (C + C_y)</text>

  <rect x="450" y="188" width="280" height="86" rx="10" fill="rgba(14,116,144,0.04)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.1"/>
  <text x="466" y="208" font-size="10" fill="var(--fig-ink-2, #555)">Every pixel position now carries a copy of the</text>
  <text x="466" y="224" font-size="10" fill="var(--fig-ink-2, #555)">condition, so a convolution kernel anywhere in</text>
  <text x="466" y="240" font-size="10" fill="var(--fig-ink-2, #555)">the image can see which class it is looking at</text>
  <text x="466" y="256" font-size="10" fill="var(--fig-ink-2, #555)">without any global pooling or flattening.</text>
  <text x="466" y="270" font-size="10.5" font-style="italic" fill="var(--fig-teal, #0e7490)">Same trick works for text/CLIP embeddings.</text>
</svg>
