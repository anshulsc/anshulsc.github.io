<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Row 1: classical -->
  <text x="30" y="38" font-size="12" font-weight="700" fill="#333" letter-spacing="1">CLASSICAL MODELING — SIMPLE PHYSICAL SYSTEMS</text>

  <rect x="30" y="55" width="170" height="58" rx="9" fill="#fafafa" stroke="#bbb" stroke-width="1.3"/>
  <text x="115" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#444">Measurable input</text>
  <text x="115" y="98" text-anchor="middle" font-size="11" fill="#777">acceleration a ∈ ℝ</text>

  <rect x="255" y="55" width="230" height="58" rx="9" fill="rgba(14,116,144,0.06)" stroke="#0e7490" stroke-width="1.4"/>
  <text x="370" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0e7490">Analytical equation</text>
  <text x="370" y="99" text-anchor="middle" font-size="12" fill="#333" font-family="Georgia, serif" font-style="italic">F = ma — one parameter, deterministic</text>

  <rect x="540" y="55" width="190" height="58" rx="9" fill="#fafafa" stroke="#bbb" stroke-width="1.3"/>
  <text x="635" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#444">Measurable output</text>
  <text x="635" y="98" text-anchor="middle" font-size="11" fill="#777">force F ∈ ℝ</text>

  <path d="M 200 84 L 252 84" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr2)"/>
  <path d="M 485 84 L 537 84" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr2)"/>

  <!-- divider -->
  <line x1="30" y1="150" x2="730" y2="150" stroke="#eee" stroke-width="1"/>

  <!-- Row 2: ML -->
  <text x="30" y="185" font-size="12" font-weight="700" fill="#333" letter-spacing="1">MACHINE LEARNING — COMPLEX ABSTRACT SYSTEMS</text>

  <rect x="30" y="202" width="170" height="58" rx="9" fill="#fafafa" stroke="#bbb" stroke-width="1.3"/>
  <text x="115" y="227" text-anchor="middle" font-size="11.5" font-weight="600" fill="#444">High-dim input</text>
  <text x="115" y="245" text-anchor="middle" font-size="11" fill="#777">image x ∈ ℝ^(P×Q)</text>

  <rect x="255" y="202" width="230" height="58" rx="9" fill="rgba(14,116,144,0.06)" stroke="#0e7490" stroke-width="1.4"/>
  <text x="370" y="227" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0e7490">Probabilistic model / neural net</text>
  <text x="370" y="246" text-anchor="middle" font-size="11" fill="#333">millions of parameters, statistical</text>

  <rect x="540" y="202" width="190" height="58" rx="9" fill="#fafafa" stroke="#bbb" stroke-width="1.3"/>
  <text x="635" y="227" text-anchor="middle" font-size="11.5" font-weight="600" fill="#444">Abstract output</text>
  <text x="635" y="245" text-anchor="middle" font-size="11" fill="#777">label y ∈ {0, 1}, subjective</text>

  <path d="M 200 231 L 252 231" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr2)"/>
  <path d="M 485 231 L 537 231" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr2)"/>
</svg>
