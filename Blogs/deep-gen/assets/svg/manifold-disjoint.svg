<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, -apple-system, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-ink, #333)">why two "close" distributions can still have nothing in common</text>

  <rect x="40" y="40" width="480" height="212" rx="10" fill="var(--fig-wash, #fbfcfc)" stroke="var(--fig-line, #ddd)"/>
  <text x="280" y="60" text-anchor="middle" font-size="10.6" font-style="italic" fill="var(--fig-muted-2, #999)">the 784-dimensional space of all 28×28 images</text>

  <path d="M 96 176 C 150 96, 230 200, 300 112" fill="none" stroke="var(--fig-teal, #0e7490)" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="200" font-size="10.8" font-weight="700" fill="var(--fig-teal, #0e7490)">P_r: real digits</text>
  <text x="120" y="215" font-size="10.5" fill="var(--fig-teal, #0e7490)">a thin curved sheet</text>

  <path d="M 268 218 C 330 148, 400 236, 468 158" fill="none" stroke="var(--fig-amber, #d97706)" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 5"/>
  <text x="330" y="244" font-size="10.8" font-weight="700" fill="var(--fig-amber, #d97706)">P_θ: what the generator makes</text>

  <g fill="var(--fig-faint, #bbb)">
    <circle cx="150" cy="70" r="1.6"/><circle cx="380" cy="66" r="1.6"/><circle cx="460" cy="92" r="1.6"/>
    <circle cx="88" cy="120" r="1.6"/><circle cx="200" cy="238" r="1.6"/><circle cx="430" cy="200" r="1.6"/>
    <circle cx="330" cy="80" r="1.6"/><circle cx="110" cy="238" r="1.6"/><circle cx="490" cy="120" r="1.6"/>
  </g>
  <text x="540" y="76" text-anchor="end" font-size="10.5" fill="var(--fig-faint, #bbb)">random pixel noise lives out here, almost everywhere</text>

  <line x1="300" y1="112" x2="268" y2="218" stroke="var(--fig-purple, #7c3aed)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="292" y="168" font-size="10.5" font-weight="600" fill="var(--fig-purple, #7c3aed)">gap</text>

  <rect x="540" y="40" width="200" height="122" rx="9" fill="rgba(200,60,60,0.05)" stroke="var(--fig-red, #c0392b)" stroke-width="1.2"/>
  <text x="640" y="60" text-anchor="middle" font-size="10.6" font-weight="700" fill="var(--fig-red, #c0392b)">what JS sees</text>
  <text x="554" y="79" font-size="10.5" fill="var(--fig-red, #c0392b)">The sheets do not touch, so at</text>
  <text x="554" y="93" font-size="10.5" fill="var(--fig-red, #c0392b)">every point at most one density</text>
  <text x="554" y="107" font-size="10.5" fill="var(--fig-red, #c0392b)">is non-zero. D_JS = log 2 exactly,</text>
  <text x="554" y="121" font-size="10.5" fill="var(--fig-red, #c0392b)">whether the gap is tiny or vast.</text>
  <text x="554" y="139" font-size="10.5" font-weight="700" fill="var(--fig-red, #c0392b)">Constant ⟹ zero gradient.</text>
  <text x="554" y="154" font-size="10.5" fill="var(--fig-red, #c0392b)">The generator is told nothing.</text>

  <rect x="540" y="174" width="200" height="78" rx="9" fill="rgba(14,116,144,0.05)" stroke="var(--fig-teal, #0e7490)" stroke-width="1.2"/>
  <text x="640" y="194" text-anchor="middle" font-size="10.6" font-weight="700" fill="var(--fig-teal, #0e7490)">what Wasserstein sees</text>
  <text x="554" y="213" font-size="10.5" fill="var(--fig-teal, #0e7490)">The length of the purple gap,</text>
  <text x="554" y="227" font-size="10.5" fill="var(--fig-teal, #0e7490)">a real number that shrinks as</text>
  <text x="554" y="241" font-size="10.5" fill="var(--fig-teal, #0e7490)">the sheets approach. Usable.</text>

  <text x="380" y="278" text-anchor="middle" font-size="10.8" fill="var(--fig-ink-2, #555)">Toss a fair coin 784 times to set each pixel black or white. The chance of producing a recognisable digit is, for practical purposes, zero:</text>
  <text x="380" y="296" text-anchor="middle" font-size="10.8" fill="var(--fig-ink-2, #555)">real digits occupy an unimaginably thin slice of the 2⁷⁸⁴ possibilities. Two such slices, placed independently, generically never intersect.</text>
</svg>
