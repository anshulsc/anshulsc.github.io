<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, -apple-system, sans-serif">
  <defs><g id="quad"><path d="M 34 34 Q 46 20 62 21 L 92 21 Q 104 22 106 32 Q 108 42 100 46 L 44 47 Q 33 45 34 34 Z"/><path d="M 44 30 L 30 12 L 40 6 L 54 26 Z"/><path d="M 41 2 L 36 13 L 15 14 L 13 21 L 34 23 L 48 15 Z"/><path d="M 40 3 L 35 -5 L 45 0 Z"/><rect x="46" y="44" width="6" height="34" rx="2"/><rect x="58" y="44" width="6" height="34" rx="2"/><rect x="86" y="44" width="6" height="34" rx="2"/><rect x="97" y="44" width="6" height="34" rx="2"/><path d="M 105 24 Q 119 32 113 56 L 108 53 Q 113 35 102 30 Z"/></g><clipPath id="bclip"><path d="M 34 34 Q 46 20 62 21 L 92 21 Q 104 22 106 32 Q 108 42 100 46 L 44 47 Q 33 45 34 34 Z"/></clipPath><g id="stripes" clip-path="url(#bclip)" stroke="#fff"><path stroke-width="4.5" d="M 50 16 L 45 52 M 61 15 L 56 53 M 72 15 L 67 53 M 83 15 L 78 53 M 94 17 L 90 51"/><path stroke-width="3.4" d="M 55 15 L 51 53 M 66 15 L 62 53 M 77 15 L 73 53 M 88 16 L 84 52"/></g>
    <marker id="cf-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/></marker>
    <marker id="cf-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0e7490"/></marker>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">the adversarial loss never mentions the input — so the generator need not respect it</text>

  <rect x="16" y="34" width="728" height="146" rx="10" fill="#fcfcfc" stroke="#e8d5d5"/>
  <text x="34" y="54" font-size="11.5" font-weight="700" fill="#c0392b">adversarial loss alone — a degenerate but perfectly valid solution</text>
  <g fill="#0e7490">
    <g transform="translate(30,56) scale(0.42)"><use href="#quad"/></g>
    <g transform="translate(114,96) scale(-0.36,0.36)"><use href="#quad"/></g>
    <g transform="translate(34,132) scale(0.48)"><use href="#quad"/></g>
  </g>
  <text x="60" y="176" text-anchor="middle" font-size="9.2" fill="#0e7490">three different horses</text>
  <path d="M 122 76 L 176 108" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#cf-o)"/>
  <path d="M 122 114 L 176 114" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#cf-o)"/>
  <path d="M 122 152 L 176 120" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#cf-o)"/>
  <rect x="178" y="98" width="48" height="32" rx="7" fill="rgba(217,119,6,0.10)" stroke="#d97706" stroke-width="1.4"/>
  <text x="202" y="119" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d97706">G₁</text>
  <path d="M 228 114 L 268 114" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#cf-o)"/>
  <g transform="translate(268,90) scale(0.46)"><g fill="#3a3a3a"><use href="#quad"/></g><use href="#stripes"/></g>
  <text x="300" y="176" text-anchor="middle" font-size="9.4" fill="#c0392b">one identical zebra, every time</text>
  <rect x="386" y="98" width="128" height="30" rx="7" fill="rgba(14,116,144,0.07)" stroke="#0e7490" stroke-width="1.3"/>
  <text x="450" y="118" text-anchor="middle" font-size="10.2" font-weight="600" fill="#0e7490">D_T: real zebra ✓</text>
  <path d="M 360 112 L 382 112" stroke="#0e7490" stroke-width="1.3" fill="none" marker-end="url(#cf-t)"/>
  <rect x="534" y="78" width="204" height="72" rx="9" fill="rgba(200,60,60,0.06)" stroke="#c0392b" stroke-width="1.3"/>
  <text x="632" y="98" text-anchor="middle" font-size="10.8" font-weight="700" fill="#c0392b">✗ useless as a translation</text>
  <text x="548" y="116" font-size="9.6" fill="#c0392b">The loss said "outputs must look like P_T".</text>
  <text x="548" y="131" font-size="9.8" fill="#c0392b">It never said the output must have</text>
  <text x="548" y="146" font-size="9.8" fill="#c0392b">anything to do with the input.</text>

  <rect x="16" y="192" width="728" height="126" rx="10" fill="#fcfcfc" stroke="#dfe8ea"/>
  <text x="34" y="212" font-size="11.5" font-weight="700" fill="#0e7490">add the round trip — and the same shortcut becomes unaffordable</text>
  <g transform="translate(38,218) scale(0.44)" fill="#0e7490"><use href="#quad"/></g>
  <text x="70" y="296" text-anchor="middle" font-size="9.2" fill="#777">s</text>
  <path d="M 106 254 L 140 254" stroke="#0e7490" stroke-width="1.4" fill="none" marker-end="url(#cf-t)"/>
  <text x="123" y="247" text-anchor="middle" font-size="8.6" fill="#0e7490">G₁</text>
  <g transform="translate(146,218) scale(0.44)"><g fill="#3a3a3a"><use href="#quad"/></g><use href="#stripes"/></g>
  <text x="178" y="296" text-anchor="middle" font-size="9.2" fill="#777">collapsed output</text>
  <path d="M 214 254 L 248 254" stroke="#0e7490" stroke-width="1.4" fill="none" marker-end="url(#cf-t)"/>
  <text x="231" y="247" text-anchor="middle" font-size="8.6" fill="#0e7490">G₂</text>
  <rect x="252" y="224" width="56" height="56" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="280" y="260" text-anchor="middle" font-size="18" fill="#c0392b">?</text>
  <text x="280" y="296" text-anchor="middle" font-size="9.2" fill="#c0392b">which horse was it?</text>
  <rect x="336" y="212" width="394" height="90" rx="9" fill="rgba(14,116,144,0.04)" stroke="#0e7490" stroke-width="1.2"/>
  <text x="352" y="234" font-size="10.2" fill="#444">If every horse maps to the same zebra, the information saying <tspan font-style="italic">which</tspan> horse</text>
  <text x="352" y="251" font-size="10.2" fill="#444">it was has been destroyed, and G₂ cannot possibly restore it.</text>
  <text x="352" y="274" font-size="10.2" font-weight="600" fill="#0e7490">So ‖G₂(G₁(s)) − s‖₁ blows up and collapse is punished — without anyone</text>
  <text x="352" y="291" font-size="10.2" font-weight="600" fill="#0e7490">ever having to list which features to preserve.</text>
</svg>
