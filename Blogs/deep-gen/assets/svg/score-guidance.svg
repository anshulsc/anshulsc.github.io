<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="sg-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0e7490"/></marker>
  <marker id="sg-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/></marker></defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">predicting noise is estimating a score — and scores add</text>

  <rect x="16" y="38" width="358" height="116" rx="10" fill="#fcfcfc" stroke="#dfe8ea"/>
  <text x="34" y="58" font-size="11" font-weight="700" fill="#0e7490">Tweedie, applied to the forward marginal</text>
  <text x="34" y="80" font-size="10.4" fill="#333">𝔼[μ_z | z] = z + Σ_z ∇_z log p(z)</text>
  <path d="M 190 88 L 190 102" stroke="#0e7490" stroke-width="1.4" fill="none" marker-end="url(#sg-t)"/>
  <text x="34" y="120" font-size="10.4" fill="#333">with z = x_t, μ_z = √ᾱ_t x₀, Σ_z = (1−ᾱ_t) I</text>
  <text x="34" y="142" font-size="11" font-weight="700" fill="#0e7490">⟹  ∇ log p(x_t) = − ε / √(1 − ᾱ_t)</text>

  <rect x="386" y="38" width="358" height="116" rx="10" fill="rgba(14,116,144,0.05)" stroke="#0e7490" stroke-width="1.3"/>
  <text x="404" y="58" font-size="11" font-weight="700" fill="#0e7490">what that buys</text>
  <text x="404" y="78" font-size="9.8" fill="#555">The network you already trained to predict noise is,</text>
  <text x="404" y="92" font-size="9.8" fill="#555">up to a known constant, a score estimator. So anything</text>
  <text x="404" y="106" font-size="9.8" fill="#555">expressible as an operation on scores is available for</text>
  <text x="404" y="120" font-size="9.8" fill="#555">free — no retraining, no architectural change.</text>
  <text x="404" y="142" font-size="9.8" font-style="italic" fill="#0e7490">Conditioning is exactly such an operation.</text>

  <rect x="16" y="166" width="728" height="86" rx="10" fill="#fcfcfc" stroke="#e8e2d5"/>
  <text x="34" y="186" font-size="11" font-weight="700" fill="#d97706">classifier guidance — Bayes, differentiated</text>
  <text x="34" y="208" font-size="11" fill="#333">∇ log p(x_t | y)</text>
  <text x="140" y="208" font-size="11" fill="#333">=</text>
  <rect x="156" y="194" width="150" height="22" rx="5" fill="rgba(14,116,144,0.10)" stroke="#0e7490" stroke-width="1.1"/>
  <text x="231" y="209" text-anchor="middle" font-size="10" fill="#0e7490">∇ log p(x_t)</text>
  <text x="316" y="208" font-size="11" fill="#333">+</text>
  <rect x="330" y="194" width="164" height="22" rx="5" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="412" y="209" text-anchor="middle" font-size="10" fill="#7c3aed">∇ log p(y | x_t)</text>
  <text x="506" y="208" font-size="11" fill="#333">−</text>
  <rect x="520" y="194" width="120" height="22" rx="5" fill="#f2f2f2" stroke="#aaa" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="580" y="209" text-anchor="middle" font-size="10" fill="#999">∇ log p(y) = 0</text>
  <text x="231" y="234" text-anchor="middle" font-size="9.4" fill="#0e7490">your existing unconditional model</text>
  <text x="412" y="234" text-anchor="middle" font-size="9.4" fill="#7c3aed">a separate classifier on noisy inputs</text>
  <text x="660" y="234" text-anchor="middle" font-size="9.4" fill="#999">no x_t in it</text>

  <text x="380" y="278" text-anchor="middle" font-size="10.6" fill="#555">Scale the second term by s and you get a knob. But s ≠ 1 is no longer the true posterior — it samples ∝ p(x)·p(y|x)ˢ,</text>
  <text x="380" y="294" text-anchor="middle" font-size="10.6" fill="#555">which is why turning guidance up sharpens class identity and quietly destroys diversity.</text>
</svg>
