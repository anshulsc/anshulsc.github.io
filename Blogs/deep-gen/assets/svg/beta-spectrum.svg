<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, -apple-system, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">one knob, and what it buys and costs at each setting</text>

  <line x1="60" y1="60" x2="710" y2="60" stroke="#555" stroke-width="1.6"/>
  <path d="M 710 60 L 702 56 L 702 64 Z" fill="#555"/>
  <text x="726" y="64" font-size="10.4" font-weight="600" fill="#555">β</text>
  <g stroke="#555" stroke-width="1.4">
    <line x1="105" y1="54" x2="105" y2="66"/><line x1="271" y1="54" x2="271" y2="66"/>
    <line x1="437" y1="54" x2="437" y2="66"/><line x1="603" y1="54" x2="603" y2="66"/>
  </g>
  <text x="105" y="46" text-anchor="middle" font-size="10.4" font-weight="700" fill="#c0392b">β = 0</text>
  <text x="271" y="46" text-anchor="middle" font-size="10.4" font-weight="700" fill="#d97706">0 &lt; β &lt; 1</text>
  <text x="437" y="46" text-anchor="middle" font-size="10.4" font-weight="700" fill="#0e7490">β = 1</text>
  <text x="603" y="46" text-anchor="middle" font-size="10.4" font-weight="700" fill="#7c3aed">β ≫ 1</text>

  <rect x="30" y="82" width="150" height="176" rx="9" fill="rgba(200,60,60,0.05)" stroke="#c0392b" stroke-width="1.3"/>
  <text x="105" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b">no regularisation</text>
  <g fill="rgba(14,116,144,0.8)">
    <circle cx="56" cy="126" r="2.6"/><circle cx="150" cy="140" r="2.6"/><circle cx="72" cy="168" r="2.6"/>
    <circle cx="142" cy="112" r="2.6"/><circle cx="98" cy="150" r="2.6"/><circle cx="120" cy="180" r="2.6"/>
  </g>
  <text x="105" y="204" text-anchor="middle" font-size="9.2" fill="#c0392b">spikes, arbitrary places</text>
  <text x="105" y="222" text-anchor="middle" font-size="9.4" fill="#333">reconstruction: sharp ✓</text>
  <text x="105" y="238" text-anchor="middle" font-size="9.4" fill="#c0392b">generation: impossible ✗</text>
  <text x="105" y="252" text-anchor="middle" font-size="8.8" font-style="italic" fill="#999">it is a plain autoencoder</text>

  <rect x="196" y="82" width="150" height="176" rx="9" fill="rgba(217,119,6,0.05)" stroke="#d97706" stroke-width="1.3"/>
  <text x="271" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">detail-heavy</text>
  <g fill="rgba(14,116,144,0.28)" stroke="#0e7490" stroke-width="0.9">
    <circle cx="232" cy="132" r="9"/><circle cx="290" cy="122" r="9"/><circle cx="256" cy="164" r="9"/>
    <circle cx="312" cy="158" r="9"/><circle cx="222" cy="176" r="9"/>
  </g>
  <text x="271" y="204" text-anchor="middle" font-size="9.2" fill="#d97706">covered, but gaps remain</text>
  <text x="271" y="222" text-anchor="middle" font-size="9.4" fill="#333">reconstruction: sharp ✓</text>
  <text x="271" y="238" text-anchor="middle" font-size="9.4" fill="#d97706">samples: sometimes odd</text>

  <rect x="362" y="82" width="150" height="176" rx="9" fill="rgba(14,116,144,0.05)" stroke="#0e7490" stroke-width="1.6"/>
  <text x="437" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#0e7490">the standard VAE</text>
  <ellipse cx="437" cy="152" rx="62" ry="42" fill="none" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="4 3"/>
  <g fill="rgba(14,116,144,0.28)" stroke="#0e7490" stroke-width="0.9">
    <circle cx="410" cy="138" r="14"/><circle cx="452" cy="132" r="14"/><circle cx="424" cy="170" r="14"/>
    <circle cx="464" cy="166" r="14"/>
  </g>
  <text x="437" y="204" text-anchor="middle" font-size="9.2" fill="#0e7490">tiles the prior</text>
  <text x="437" y="222" text-anchor="middle" font-size="9.4" fill="#333">reconstruction: decent</text>
  <text x="437" y="238" text-anchor="middle" font-size="9.4" fill="#0e7490">generation: works ✓</text>

  <rect x="528" y="82" width="150" height="176" rx="9" fill="rgba(124,58,237,0.05)" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="603" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">over-regularised</text>
  <ellipse cx="603" cy="152" rx="52" ry="38" fill="none" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="603" cy="152" r="34" fill="rgba(124,58,237,0.20)" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="603" y="156" text-anchor="middle" font-size="9" fill="#5b21b6">all of them</text>
  <text x="603" y="204" text-anchor="middle" font-size="9.2" fill="#7c3aed">every q(z|x) is the prior</text>
  <text x="603" y="222" text-anchor="middle" font-size="9.4" fill="#c0392b">reconstruction: blurry ✗</text>
  <text x="603" y="238" text-anchor="middle" font-size="9.4" fill="#c0392b">z carries no information</text>
  <text x="603" y="252" text-anchor="middle" font-size="8.8" font-style="italic" fill="#999">posterior collapse</text>

  <text x="380" y="288" text-anchor="middle" font-size="10.6" fill="#555">Both ends are degenerate and both are reachable by accident. β is the dial between "a compressor that cannot sample"</text>
  <text x="380" y="304" text-anchor="middle" font-size="10.6" fill="#555">and "a sampler that has forgotten the data" — and only the middle is a generative model.</text>
</svg>
