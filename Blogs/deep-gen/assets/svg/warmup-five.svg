<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="wu-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="wu-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0e7490"/>
    </marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">
    the five things you actually need — nothing beyond a first calculus course
  </text>

  <!-- ═══ 1. EXPECTATION ═══ -->
  <rect x="14" y="32" width="238" height="146" rx="10" fill="#fcfcfc" stroke="#e3e3e3"/>
  <text x="26" y="50" font-size="11" font-weight="700" fill="#0e7490">1 · EXPECTATION</text>
  <text x="26" y="65" font-size="9.8" fill="#888">a weighted average, nothing more</text>
  <line x1="34" y1="140" x2="238" y2="140" stroke="#bbb"/>
  <rect x="52" y="92" width="30" height="48" fill="rgba(14,116,144,0.16)" stroke="#0e7490"/>
  <rect x="112" y="112" width="30" height="28" fill="rgba(14,116,144,0.16)" stroke="#0e7490"/>
  <rect x="172" y="122" width="30" height="18" fill="rgba(14,116,144,0.16)" stroke="#0e7490"/>
  <text x="67" y="153" text-anchor="middle" font-size="9.5" fill="#666">0.5</text>
  <text x="127" y="153" text-anchor="middle" font-size="9.5" fill="#666">0.3</text>
  <text x="187" y="153" text-anchor="middle" font-size="9.5" fill="#666">0.2</text>
  <text x="139" y="170" text-anchor="middle" font-size="10" fill="#555">E[h] = Σ (weight × value)</text>

  <!-- ═══ 2. CONVEX ═══ -->
  <rect x="262" y="32" width="238" height="146" rx="10" fill="#fcfcfc" stroke="#e3e3e3"/>
  <text x="274" y="50" font-size="11" font-weight="700" fill="#0e7490">2 · CONVEX</text>
  <text x="274" y="65" font-size="9.8" fill="#888">bowl-shaped: chords sit above</text>
  <path d="M 292 84 Q 380 168 470 92" fill="none" stroke="#0e7490" stroke-width="2.4"/>
  <line x1="312" y1="106" x2="452" y2="110" stroke="#d97706" stroke-width="2"/>
  <circle cx="312" cy="106" r="3.4" fill="#d97706"/>
  <circle cx="452" cy="110" r="3.4" fill="#d97706"/>
  <line x1="382" y1="108" x2="382" y2="140" stroke="#888" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="390" y="128" font-size="9.5" fill="#666">gap ≥ 0</text>
  <text x="381" y="170" text-anchor="middle" font-size="10" fill="#555">this single fact proves D_f ≥ 0</text>

  <!-- ═══ 3. SUP / ARGMAX ═══ -->
  <rect x="510" y="32" width="238" height="146" rx="10" fill="#fcfcfc" stroke="#e3e3e3"/>
  <text x="522" y="50" font-size="11" font-weight="700" fill="#0e7490">3 · sup  AND  argmax</text>
  <text x="522" y="65" font-size="9.8" fill="#888">the best value vs. where it happens</text>
  <path d="M 534 142 Q 600 68 656 108 Q 690 128 718 92" fill="none" stroke="#0e7490" stroke-width="2.4"/>
  <line x1="528" y1="84" x2="724" y2="84" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="640" y="79" font-size="9.5" fill="#d97706">sup = this height</text>
  <circle cx="604" cy="84" r="4" fill="#d97706"/>
  <line x1="604" y1="88" x2="604" y2="146" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="604" y="159" text-anchor="middle" font-size="9.5" fill="#d97706">argmax</text>
  <text x="629" y="174" text-anchor="middle" font-size="10" fill="#555">read sup as max — it loses nothing here</text>

  <!-- ═══ 4. DENSITY RATIO ═══ -->
  <rect x="14" y="192" width="364" height="156" rx="10" fill="#fcfcfc" stroke="#e3e3e3"/>
  <text x="26" y="210" font-size="11" font-weight="700" fill="#0e7490">4 · THE DENSITY RATIO  u = p/q</text>
  <text x="26" y="225" font-size="9.8" fill="#888">the one signal that says how the two distributions disagree</text>
  <line x1="34" y1="310" x2="360" y2="310" stroke="#bbb"/>
  <path d="M 40 310 C 100 240, 130 236, 180 310" fill="none" stroke="#0e7490" stroke-width="2.2"/>
  <path d="M 180 310 C 240 236, 280 240, 350 310" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="96" y="252" font-size="10" fill="#0e7490">p (real)</text>
  <text x="272" y="252" font-size="10" fill="#d97706">q (model)</text>
  <text x="92" y="300" text-anchor="middle" font-size="9.5" fill="#0e7490">u &gt; 1 here</text>
  <text x="180" y="326" text-anchor="middle" font-size="9.5" fill="#555">u = 1</text>
  <text x="278" y="300" text-anchor="middle" font-size="9.5" fill="#d97706">u &lt; 1 here</text>
  <line x1="180" y1="234" x2="180" y2="316" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="196" y="342" font-size="10" fill="#555">u = 1 everywhere  ⟺  the model is perfect</text>

  <!-- ═══ 5. A GRADIENT STEP ═══ -->
  <rect x="388" y="192" width="360" height="156" rx="10" fill="#fcfcfc" stroke="#e3e3e3"/>
  <text x="400" y="210" font-size="11" font-weight="700" fill="#0e7490">5 · A GRADIENT STEP</text>
  <text x="400" y="225" font-size="9.8" fill="#888">roll downhill by the slope, times a small number</text>
  <path d="M 410 250 Q 560 350 720 258" fill="none" stroke="#0e7490" stroke-width="2.4"/>
  <circle cx="452" cy="284" r="6" fill="#d97706"/>
  <path d="M 466 296 L 516 318" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#wu-o)"/>
  <circle cx="566" cy="330" r="5" fill="rgba(217,119,6,0.35)"/>
  <text x="576" y="316" font-size="10" fill="#555">θ ← θ − α·(slope)</text>
  <text x="700" y="286" text-anchor="end" font-size="9.5" fill="#888">α = learning rate</text>
</svg>
