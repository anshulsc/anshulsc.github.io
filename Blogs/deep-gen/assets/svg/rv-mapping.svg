<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0e7490"/>
    </marker>
  </defs>

  <!-- Sample space blob -->
  <ellipse cx="150" cy="150" rx="115" ry="95" fill="rgba(14,116,144,0.05)" stroke="#0e7490" stroke-width="1.5"/>
  <text x="150" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">Sample space Ω</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#888">abstract outcomes of a random experiment</text>
  <text x="150" y="294" text-anchor="middle" font-size="11" fill="#888">(people, sentences, coin faces …)</text>

  <!-- outcomes -->
  <circle cx="105" cy="120" r="4" fill="#0e7490"/>
  <text x="105" y="106" text-anchor="middle" font-size="11" fill="#555">ω₁</text>
  <circle cx="185" cy="140" r="4" fill="#0e7490"/>
  <text x="185" y="126" text-anchor="middle" font-size="11" fill="#555">ω₂</text>
  <circle cx="130" cy="190" r="4" fill="#0e7490"/>
  <text x="130" y="212" text-anchor="middle" font-size="11" fill="#555">ω₃</text>

  <!-- mapping arrows -->
  <path d="M 190 140 C 300 110, 350 110, 445 128" stroke="#0e7490" stroke-width="1.4" fill="none" marker-end="url(#arr3)"/>
  <path d="M 135 190 C 280 235, 360 215, 448 172" stroke="#0e7490" stroke-width="1.4" fill="none" marker-end="url(#arr3)"/>

  <text x="320" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#333" font-family="Georgia, serif" font-style="italic">X : Ω → ℝᵈ</text>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#888">a fixed, deterministic function</text>

  <!-- Range space -->
  <rect x="455" y="60" width="275" height="185" rx="12" fill="#fafafa" stroke="#bbb" stroke-width="1.3"/>
  <text x="592" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Range space ℝᵈ</text>

  <!-- axis + density -->
  <line x1="480" y1="210" x2="710" y2="210" stroke="#999" stroke-width="1.2"/>
  <path d="M 485 208 C 520 205, 535 130, 565 128 C 590 127, 595 185, 615 185 C 635 185, 645 105, 668 103 C 690 102, 700 200, 707 207"
        fill="rgba(14,116,144,0.12)" stroke="#0e7490" stroke-width="1.8"/>
  <text x="592" y="235" text-anchor="middle" font-size="11" fill="#777">observed vectors x = X(ω)</text>
  <text x="660" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0e7490">induced density p&#8339;(x)</text>

  <!-- mapped points on axis -->
  <circle cx="560" cy="210" r="3.5" fill="#0e7490"/>
  <circle cx="600" cy="210" r="3.5" fill="#0e7490"/>
  <circle cx="665" cy="210" r="3.5" fill="#0e7490"/>

  <text x="380" y="300" text-anchor="middle" font-size="11.5" fill="#666">The randomness lives in the experiment; X just translates outcomes into numbers we can compute with.</text>
</svg>
