<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">every generative model gives something up — flows give up the bottleneck</text>

  <rect x="16" y="40" width="176" height="184" rx="10" fill="#fcfcfc" stroke="#e8e2d5"/>
  <text x="104" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d97706">GAN</text>
  <text x="30" y="86" font-size="9.8" fill="#0e7490">✓ superb samples</text>
  <text x="30" y="104" font-size="9.8" fill="#0e7490">✓ fast, one forward pass</text>
  <text x="30" y="126" font-size="9.8" fill="#c0392b">✗ no density at all</text>
  <text x="30" y="144" font-size="9.8" fill="#c0392b">✗ implicit: cannot score</text>
  <text x="30" y="158" font-size="9.8" fill="#c0392b">   an arbitrary image</text>
  <text x="30" y="180" font-size="9.8" fill="#c0392b">✗ unstable, mode collapse</text>
  <text x="104" y="210" text-anchor="middle" font-size="9.2" font-style="italic" fill="#999">Ch.3–Ch.5</text>

  <rect x="204" y="40" width="176" height="184" rx="10" fill="#fcfcfc" stroke="#e8e2d5"/>
  <text x="292" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d97706">VAE</text>
  <text x="218" y="86" font-size="9.8" fill="#0e7490">✓ explicit latent model</text>
  <text x="218" y="104" font-size="9.8" fill="#0e7490">✓ compresses: dim(z) ≪ dim(x)</text>
  <text x="218" y="126" font-size="9.8" fill="#c0392b">✗ only a bound on log p(x),</text>
  <text x="218" y="140" font-size="9.8" fill="#c0392b">   never the density itself</text>
  <text x="218" y="162" font-size="9.8" fill="#c0392b">✗ blurry; posterior collapse</text>
  <text x="292" y="210" text-anchor="middle" font-size="9.2" font-style="italic" fill="#999">Ch.7–Ch.8</text>

  <rect x="392" y="40" width="176" height="184" rx="10" fill="rgba(14,116,144,0.06)" stroke="#0e7490" stroke-width="1.8"/>
  <text x="480" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e7490">NORMALIZING FLOW</text>
  <text x="406" y="86" font-size="9.8" fill="#0e7490">✓ <tspan font-weight="600">exact</tspan> log p(x), not a bound</text>
  <text x="406" y="104" font-size="9.8" fill="#0e7490">✓ exact, one-pass sampling</text>
  <text x="406" y="122" font-size="9.8" fill="#0e7490">✓ trained by plain max-likelihood</text>
  <text x="406" y="144" font-size="9.8" fill="#c0392b">✗ <tspan font-weight="600">no bottleneck</tspan>: dim(z) = dim(x)</text>
  <text x="406" y="162" font-size="9.8" fill="#c0392b">✗ every layer must be invertible</text>
  <text x="406" y="180" font-size="9.8" fill="#c0392b">   with a cheap Jacobian</text>
  <text x="480" y="210" text-anchor="middle" font-size="9.2" font-style="italic" fill="#0e7490">this chapter</text>

  <rect x="580" y="40" width="164" height="184" rx="10" fill="#fcfcfc" stroke="#e8e2d5"/>
  <text x="662" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d97706">DIFFUSION</text>
  <text x="594" y="86" font-size="9.8" fill="#0e7490">✓ best sample quality</text>
  <text x="594" y="104" font-size="9.8" fill="#0e7490">✓ very stable training</text>
  <text x="594" y="126" font-size="9.8" fill="#c0392b">✗ bound, not exact density</text>
  <text x="594" y="148" font-size="9.8" fill="#c0392b">✗ sampling needs many</text>
  <text x="594" y="162" font-size="9.8" fill="#c0392b">   sequential passes</text>
  <text x="662" y="210" text-anchor="middle" font-size="9.2" font-style="italic" fill="#999">Ch.9–Ch.10</text>

  <text x="380" y="252" text-anchor="middle" font-size="10.6" fill="#555">Flows are the only family in this row that hands you the <tspan font-style="italic">exact</tspan> likelihood of an arbitrary point and a one-shot sampler at the same time.</text>
  <text x="380" y="272" text-anchor="middle" font-size="10.6" fill="#555">The price is paid entirely in architecture: no compression anywhere, and every layer constrained to be invertible.</text>
</svg>
