<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, -apple-system, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">the same two distributions, measured two ways, as they slide apart</text>

  <line x1="80" y1="252" x2="700" y2="252" stroke="#999" stroke-width="1.2"/>
  <line x1="80" y1="52" x2="80" y2="252" stroke="#999" stroke-width="1.2"/>
  <text x="520" y="278" text-anchor="middle" font-size="10.4" fill="#777">separation θ between the two supports  ⟶</text>
  <text x="70" y="256" text-anchor="end" font-size="9.6" fill="#aaa">0</text>

  <line x1="80" y1="96" x2="700" y2="96" stroke="#ddd" stroke-dasharray="4 4"/>
  <text x="70" y="100" text-anchor="end" font-size="9.6" fill="#aaa">log 2</text>

  <path d="M 80 252 L 84 96 L 700 96" fill="none" stroke="#c0392b" stroke-width="2.6"/>
  <text x="196" y="88" font-size="10.8" font-weight="700" fill="#c0392b">Jensen–Shannon — jumps to log 2 and stays there</text>
  <text x="196" y="120" font-size="9.8" fill="#c0392b">flat ⟹ ∇ = 0 ⟹ the generator learns nothing, at any separation</text>

  <path d="M 80 252 L 700 108" fill="none" stroke="#0e7490" stroke-width="2.6"/>
  <text x="470" y="176" font-size="10.8" font-weight="700" fill="#0e7490">Wasserstein — grows as |θ|</text>
  <text x="470" y="192" font-size="9.8" fill="#0e7490">a constant, non-zero slope everywhere</text>

  <circle cx="80" cy="252" r="4.6" fill="#111"/>
  <text x="94" y="268" font-size="9.6" fill="#111">both are 0 only when the distributions coincide</text>

  <text x="380" y="304" text-anchor="middle" font-size="10" fill="#999">The classic example: two parallel vertical line-segments in the plane, offset by θ. Everything above is exact for that case, not a sketch.</text>
</svg>
