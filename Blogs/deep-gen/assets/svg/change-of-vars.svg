<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, -apple-system, sans-serif">
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">stretch the axis and the density must thin out — that is the whole change-of-variables formula</text>

  <text x="120" y="52" text-anchor="middle" font-size="10.6" font-weight="600" fill="#777">base density p(z)</text>
  <path d="M 40 150 Q 70 150 90 110 Q 110 62 120 62 Q 130 62 150 110 Q 170 150 200 150" fill="rgba(140,140,140,0.14)" stroke="#999" stroke-width="2"/>
  <line x1="34" y1="150" x2="208" y2="150" stroke="#ccc"/>
  <text x="120" y="166" text-anchor="middle" font-size="9.4" fill="#999">z</text>

  <g stroke="#0e7490" stroke-width="1.1" opacity="0.75">
    <line x1="100" y1="150" x2="100" y2="98"/>
    <line x1="110" y1="150" x2="110" y2="76"/>
    <line x1="120" y1="150" x2="120" y2="62"/>
    <line x1="130" y1="150" x2="130" y2="76"/>
    <line x1="140" y1="150" x2="140" y2="98"/>
  </g>
  <rect x="100" y="150" width="40" height="9" fill="rgba(14,116,144,0.35)"/>
  <text x="120" y="184" text-anchor="middle" font-size="9.6" fill="#0e7490">a slab of width Δz</text>
  <text x="120" y="197" text-anchor="middle" font-size="9.6" fill="#0e7490">holding mass p(z)·Δz</text>

  <path d="M 226 118 h 62" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker></defs>
  <text x="257" y="110" text-anchor="middle" font-size="10.4" font-weight="600" fill="#7c3aed">x = f(z)</text>
  <text x="257" y="134" text-anchor="middle" font-size="9.2" fill="#7c3aed">stretches by</text>
  <text x="257" y="146" text-anchor="middle" font-size="9.2" fill="#7c3aed">a factor |f′|</text>

  <text x="420" y="52" text-anchor="middle" font-size="10.6" font-weight="600" fill="#777">transformed density q(x)</text>
  <path d="M 306 150 Q 350 150 380 128 Q 410 104 420 104 Q 430 104 460 128 Q 490 150 534 150" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="2"/>
  <line x1="300" y1="150" x2="542" y2="150" stroke="#ccc"/>
  <text x="420" y="166" text-anchor="middle" font-size="9.4" fill="#999">x</text>

  <g stroke="#0e7490" stroke-width="1.1" opacity="0.75">
    <line x1="380" y1="150" x2="380" y2="128"/>
    <line x1="400" y1="150" x2="400" y2="111"/>
    <line x1="420" y1="150" x2="420" y2="104"/>
    <line x1="440" y1="150" x2="440" y2="111"/>
    <line x1="460" y1="150" x2="460" y2="128"/>
  </g>
  <rect x="380" y="150" width="80" height="9" fill="rgba(14,116,144,0.35)"/>
  <text x="420" y="184" text-anchor="middle" font-size="9.6" fill="#0e7490">the SAME mass, now spread</text>
  <text x="420" y="197" text-anchor="middle" font-size="9.6" fill="#0e7490">over a slab twice as wide</text>
  <text x="420" y="212" text-anchor="middle" font-size="9.6" font-weight="600" fill="#c0392b">→ so the height must halve</text>

  <rect x="560" y="60" width="186" height="150" rx="9" fill="rgba(14,116,144,0.05)" stroke="#0e7490" stroke-width="1.2"/>
  <text x="653" y="82" text-anchor="middle" font-size="10.6" font-weight="700" fill="#0e7490">the bookkeeping</text>
  <text x="574" y="104" font-size="10" fill="#333">mass in = mass out:</text>
  <text x="653" y="126" text-anchor="middle" font-size="11" fill="#333" font-style="italic">q(x)·Δx = p(z)·Δz</text>
  <text x="574" y="148" font-size="10" fill="#333">divide by Δx and let Δ→0:</text>
  <text x="653" y="172" text-anchor="middle" font-size="11" fill="#0e7490" font-weight="600" font-style="italic">q(x) = p(z)·|dz/dx|</text>
  <text x="574" y="194" font-size="9.4" fill="#777">Nothing else is going on. The whole</text>
  <text x="574" y="205" font-size="9.4" fill="#777">field is built on this one line.</text>

  <line x1="30" y1="240" x2="730" y2="240" stroke="#e8e2d5"/>
  <text x="380" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">and this is why the absolute value is there</text>
  <text x="200" y="288" text-anchor="middle" font-size="9.8" fill="#555">If f reverses direction — say f(z) = −2z — then dz/dx = −1/2.</text>
  <text x="200" y="303" text-anchor="middle" font-size="9.8" fill="#555">Without the bars you would be claiming a NEGATIVE density,</text>
  <text x="200" y="318" text-anchor="middle" font-size="9.8" fill="#555">which is not a thing that exists.</text>
  <text x="565" y="288" text-anchor="middle" font-size="9.8" fill="#555">The signed derivative tracks <tspan font-style="italic">orientation</tspan> — whether the map</text>
  <text x="565" y="303" text-anchor="middle" font-size="9.8" fill="#555">flips left and right. Density only cares about how much the</text>
  <text x="565" y="318" text-anchor="middle" font-size="9.8" fill="#555">interval was <tspan font-style="italic">stretched</tspan>, never about which way it now points.</text>
</svg>
