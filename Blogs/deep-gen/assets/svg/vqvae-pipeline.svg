<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="vq-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0e7490"/></marker>
    <marker id="vq-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/></marker>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">VQ-VAE: replace the Gaussian latent with a lookup into a learned dictionary</text>

  <rect x="24" y="76" width="64" height="64" rx="5" fill="rgba(14,116,144,0.14)" stroke="#0e7490" stroke-width="1.4"/>
  <text x="56" y="112" text-anchor="middle" font-size="11" fill="#0e7490">x</text>
  <path d="M 92 108 L 118 108" stroke="#0e7490" stroke-width="1.6" fill="none" marker-end="url(#vq-t)"/>
  <path d="M 122 84 L 176 96 L 176 120 L 122 132 Z" fill="rgba(14,116,144,0.12)" stroke="#0e7490" stroke-width="1.6"/>
  <text x="149" y="112" text-anchor="middle" font-size="10.4" font-weight="700" fill="#0e7490">encoder</text>
  <path d="M 178 108 L 202 108" stroke="#0e7490" stroke-width="1.6" fill="none" marker-end="url(#vq-t)"/>

  <text x="240" y="72" text-anchor="middle" font-size="9.6" fill="#555">z_e(x): a grid of vectors</text>
  <g>
    <rect x="206" y="80" width="68" height="68" rx="3" fill="none" stroke="#0e7490" stroke-width="1.3"/>
    <g stroke="rgba(14,116,144,0.35)" stroke-width="0.8"><path d="M 223 80 v 68 M 240 80 v 68 M 257 80 v 68 M 206 97 h 68 M 206 114 h 68 M 206 131 h 68"/></g>
    <rect x="207" y="98" width="15" height="15" fill="rgba(217,119,6,0.55)"/>
  </g>
  <text x="240" y="160" text-anchor="middle" font-size="9" fill="#999">each cell is one K-dim vector</text>

  <path d="M 278 114 L 306 114" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#vq-p)"/>
  <rect x="310" y="90" width="112" height="48" rx="8" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="366" y="109" text-anchor="middle" font-size="10.4" font-weight="700" fill="#7c3aed">nearest neighbour</text>
  <text x="366" y="126" text-anchor="middle" font-size="9.2" fill="#7c3aed">argmin_j ‖z_e − z_j‖₂</text>

  <!-- codebook -->
  <rect x="300" y="176" width="132" height="118" rx="8" fill="#fcfcfc" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="366" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">codebook C, M entries</text>
  <g>
    <rect x="316" y="206" width="16" height="16" fill="rgba(217,119,6,0.55)" stroke="#d97706"/><text x="340" y="218" font-size="8.6" fill="#777">z₁</text>
    <rect x="316" y="228" width="16" height="16" fill="rgba(14,116,144,0.55)" stroke="#0e7490"/><text x="340" y="240" font-size="8.6" fill="#777">z₂</text>
    <rect x="316" y="250" width="16" height="16" fill="rgba(124,58,237,0.55)" stroke="#7c3aed"/><text x="340" y="262" font-size="8.6" fill="#777">z₃</text>
    <rect x="316" y="272" width="16" height="16" fill="rgba(120,120,120,0.45)" stroke="#888"/><text x="340" y="284" font-size="8.6" fill="#777">…</text>
    <text x="400" y="240" font-size="9" fill="#999">learned,</text>
    <text x="400" y="252" font-size="9" fill="#999">not fixed</text>
  </g>
  <path d="M 366 174 L 366 142" stroke="#7c3aed" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#vq-p)"/>

  <path d="M 426 114 L 452 114" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#vq-p)"/>
  <text x="490" y="72" text-anchor="middle" font-size="9.6" fill="#555">z_q(x): every cell snapped</text>
  <g>
    <rect x="456" y="80" width="68" height="68" rx="3" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
    <g stroke="rgba(124,58,237,0.35)" stroke-width="0.8"><path d="M 473 80 v 68 M 490 80 v 68 M 507 80 v 68 M 456 97 h 68 M 456 114 h 68 M 456 131 h 68"/></g>
    <rect x="457" y="98" width="15" height="15" fill="rgba(217,119,6,0.55)"/>
    <rect x="474" y="81" width="15" height="15" fill="rgba(14,116,144,0.55)"/>
    <rect x="491" y="115" width="15" height="15" fill="rgba(124,58,237,0.55)"/>
    <rect x="508" y="132" width="15" height="15" fill="rgba(120,120,120,0.45)"/>
  </g>
  <text x="490" y="160" text-anchor="middle" font-size="9" fill="#999">now just a grid of integers</text>

  <path d="M 528 114 L 554 114" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#vq-p)"/>
  <path d="M 558 96 L 612 84 L 612 144 L 558 132 Z" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.6"/>
  <text x="585" y="116" text-anchor="middle" font-size="10.4" font-weight="700" fill="#d97706">decoder</text>
  <path d="M 614 114 L 640 114" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#vq-t)"/>
  <rect x="644" y="82" width="64" height="64" rx="5" fill="rgba(217,119,6,0.14)" stroke="#d97706" stroke-width="1.4"/>
  <text x="676" y="118" text-anchor="middle" font-size="11" fill="#d97706">x̂</text>

  <rect x="460" y="186" width="276" height="104" rx="9" fill="rgba(14,116,144,0.04)" stroke="#0e7490" stroke-width="1.2"/>
  <text x="598" y="206" text-anchor="middle" font-size="10.6" font-weight="700" fill="#0e7490">what this buys</text>
  <text x="474" y="225" font-size="9.8" fill="#555">No Gaussian, so no KL term, so <tspan font-style="italic">no posterior</tspan></text>
  <text x="474" y="239" font-size="9.8" fill="#555"><tspan font-style="italic">collapse</tspan> — the failure mode of Figure 8.3 simply</text>
  <text x="474" y="253" font-size="9.8" fill="#555">cannot occur, because there is no term pulling the</text>
  <text x="474" y="267" font-size="9.8" fill="#555">code toward a prior that ignores x.</text>
  <text x="474" y="283" font-size="9.6" font-weight="600" fill="#c0392b">The cost: argmin has no gradient. See §12.</text>
</svg>
