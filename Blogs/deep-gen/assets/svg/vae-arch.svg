<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="va-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0e7490"/></marker>
    <marker id="va-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/></marker>
    <marker id="va-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/></marker>
    <g id="v3" fill="none" stroke-width="8" stroke-linecap="round"><path d="M 6 6 Q 28 0 28 16 Q 28 28 14 28 Q 28 28 28 42 Q 28 58 4 52"/></g>
  </defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">the whole VAE: two networks, one bound, one noise variable held off to the side</text>

  <rect x="26" y="96" width="76" height="76" rx="6" fill="#111" stroke="#0e7490" stroke-width="1.5"/>
  <g transform="translate(48,104)" stroke="#fff"><use href="#v3"/></g>
  <text x="64" y="188" text-anchor="middle" font-size="10.4" font-weight="600" fill="#0e7490">input x</text>

  <path d="M 106 134 L 138 134" stroke="#0e7490" stroke-width="1.6" fill="none" marker-end="url(#va-t)"/>
  <path d="M 142 108 L 210 122 L 210 146 L 142 160 Z" fill="rgba(14,116,144,0.12)" stroke="#0e7490" stroke-width="1.8"/>
  <text x="176" y="130" text-anchor="middle" font-size="10.8" font-weight="700" fill="#0e7490">encoder</text>
  <text x="176" y="145" text-anchor="middle" font-size="9.4" fill="#0e7490">q_φ(z|x)</text>
  <text x="176" y="188" text-anchor="middle" font-size="9.4" fill="#999">weights φ</text>

  <path d="M 212 128 L 244 116" stroke="#0e7490" stroke-width="1.5" fill="none" marker-end="url(#va-t)"/>
  <path d="M 212 140 L 244 152" stroke="#0e7490" stroke-width="1.5" fill="none" marker-end="url(#va-t)"/>
  <rect x="246" y="100" width="48" height="30" rx="6" fill="#fff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#0e7490">μ(x)</text>
  <rect x="246" y="138" width="48" height="30" rx="6" fill="#fff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#0e7490">σ(x)</text>

  <path d="M 296 115 L 328 128" stroke="#0e7490" stroke-width="1.5" fill="none" marker-end="url(#va-t)"/>
  <path d="M 296 153 L 328 140" stroke="#0e7490" stroke-width="1.5" fill="none" marker-end="url(#va-t)"/>

  <rect x="330" y="112" width="86" height="44" rx="8" fill="rgba(14,116,144,0.06)" stroke="#0e7490" stroke-width="1.8"/>
  <text x="373" y="130" text-anchor="middle" font-size="10.4" font-weight="700" fill="#0e7490">z = μ + σ⊙ε</text>
  <text x="373" y="146" text-anchor="middle" font-size="9" fill="#0e7490">reparameterised</text>

  <rect x="316" y="46" width="114" height="32" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="373" y="66" text-anchor="middle" font-size="10.2" fill="#555">ε ~ 𝒩(0, I)</text>
  <path d="M 373 80 L 373 108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#va-t)"/>
  <text x="440" y="62" font-size="9.2" fill="#888">the only randomness,</text>
  <text x="440" y="74" font-size="9.2" fill="#888">and φ is nowhere in it</text>

  <path d="M 418 134 L 450 134" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#va-o)"/>
  <path d="M 454 122 L 522 108 L 522 160 L 454 146 Z" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.8"/>
  <text x="488" y="130" text-anchor="middle" font-size="10.8" font-weight="700" fill="#d97706">decoder</text>
  <text x="488" y="145" text-anchor="middle" font-size="9.4" fill="#d97706">p_θ(x|z)</text>
  <text x="488" y="188" text-anchor="middle" font-size="9.4" fill="#999">weights θ</text>

  <path d="M 524 134 L 556 134" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#va-o)"/>
  <rect x="560" y="96" width="76" height="76" rx="6" fill="#1c1c1c" stroke="#d97706" stroke-width="1.5"/>
  <g transform="translate(582,104)" stroke="#e8e8e8" opacity="0.9"><use href="#v3"/></g>
  <text x="598" y="188" text-anchor="middle" font-size="10.4" font-weight="600" fill="#d97706">reconstruction x̂</text>

  <!-- the two losses -->
  <path d="M 270 172 C 270 214, 300 222, 330 222" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#va-p)"/>
  <rect x="334" y="206" width="156" height="34" rx="8" fill="rgba(124,58,237,0.07)" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="412" y="227" text-anchor="middle" font-size="10.2" font-weight="600" fill="#7c3aed">D_KL(q_φ ‖ 𝒩(0,I)) — closed form</text>

  <path d="M 64 180 C 64 262, 300 268, 380 268" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
  <path d="M 598 180 C 598 262, 470 268, 386 268" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
  <rect x="298" y="252" width="176" height="34" rx="8" fill="rgba(217,119,6,0.07)" stroke="#d97706" stroke-width="1.3"/>
  <text x="386" y="273" text-anchor="middle" font-size="10.2" font-weight="600" fill="#d97706">‖x − x̂‖² — the reconstruction term</text>

  <text x="380" y="312" text-anchor="middle" font-size="10.6" fill="#555">Both networks are updated from one scalar. The KL half is analytic; the reconstruction half needs the gradient to cross z,</text>
  <text x="380" y="328" text-anchor="middle" font-size="10.6" fill="#555">which is exactly why z had to be written as a differentiable function of μ, σ and an outside noise draw.</text>
</svg>
