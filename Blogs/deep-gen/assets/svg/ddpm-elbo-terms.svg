<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="de-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/></marker></defs>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">what the DDPM ELBO breaks into — and which piece actually trains anything</text>

  <rect x="150" y="38" width="460" height="34" rx="8" fill="rgba(14,116,144,0.07)" stroke="#0e7490" stroke-width="1.4"/>
  <text x="380" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e7490">ELBO on log p_θ(x₀)</text>
  <path d="M 240 74 L 150 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#de-t)"/>
  <path d="M 380 74 L 380 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#de-t)"/>
  <path d="M 520 74 L 610 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#de-t)"/>

  <rect x="16" y="100" width="228" height="150" rx="10" fill="#fcfcfc" stroke="#dfe8ea"/>
  <text x="130" y="120" text-anchor="middle" font-size="10.6" font-weight="700" fill="#0e7490">reconstruction</text>
  <text x="130" y="140" text-anchor="middle" font-size="10" fill="#333">𝔼 [ log p_θ(x₀ | x₁) ]</text>
  <text x="30" y="164" font-size="9.6" fill="#555">The very last denoising step,</text>
  <text x="30" y="178" font-size="9.6" fill="#555">from barely-noised x₁ back to</text>
  <text x="30" y="192" font-size="9.6" fill="#555">the clean x₀.</text>
  <text x="30" y="214" font-size="9.6" font-weight="600" fill="#0e7490">Trainable — but one term out</text>
  <text x="30" y="228" font-size="9.6" font-weight="600" fill="#0e7490">of a thousand.</text>

  <rect x="256" y="100" width="228" height="150" rx="10" fill="#fcfcfc" stroke="#e8e2d5"/>
  <text x="370" y="120" text-anchor="middle" font-size="10.6" font-weight="700" fill="#d97706">prior matching</text>
  <text x="370" y="140" text-anchor="middle" font-size="10" fill="#333">− D_KL( q(x_T|x₀) ‖ p(x_T) )</text>
  <text x="270" y="164" font-size="9.6" fill="#555">Is the fully-noised state really</text>
  <text x="270" y="178" font-size="9.6" fill="#555">𝒩(0, I)? With a fixed schedule</text>
  <text x="270" y="192" font-size="9.6" fill="#555">and T large, yes — by design.</text>
  <text x="270" y="214" font-size="9.6" font-weight="600" fill="#d97706">Contains no θ at all.</text>
  <text x="270" y="228" font-size="9.6" font-weight="600" fill="#d97706">A constant. Ignore it.</text>

  <rect x="496" y="100" width="248" height="150" rx="10" fill="rgba(14,116,144,0.06)" stroke="#0e7490" stroke-width="1.8"/>
  <text x="620" y="120" text-anchor="middle" font-size="10.6" font-weight="700" fill="#0e7490">denoising matching</text>
  <text x="620" y="140" text-anchor="middle" font-size="9.6" fill="#333">− Σ 𝔼 [ D_KL( q(x_{t−1}|x_t,x₀) ‖ p_θ ) ]</text>
  <text x="510" y="164" font-size="9.6" fill="#555">For every intermediate step:</text>
  <text x="510" y="178" font-size="9.6" fill="#555">match the learned reverse step</text>
  <text x="510" y="192" font-size="9.6" fill="#555">to the true one, which is a</text>
  <text x="510" y="206" font-size="9.6" fill="#555">Gaussian we can write down.</text>
  <text x="510" y="228" font-size="9.6" font-weight="700" fill="#0e7490">This is the whole training signal.</text>

  <text x="380" y="274" text-anchor="middle" font-size="10.6" fill="#555">The middle term is free and the left term is almost negligible. Practically all of the work is the sum on the right —</text>
  <text x="380" y="290" text-anchor="middle" font-size="10.6" fill="#555">and because both sides of that KL are Gaussians with the same covariance, it collapses to a squared distance between two means.</text>
</svg>
