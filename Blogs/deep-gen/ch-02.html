*My notes from the second lecture — the longest and, so far, the most important one. It states the central problem of machine learning in a single line, splits it into discriminative and generative halves, gives the three-step recipe for training any generative model, and derives KL divergence from scratch. Everything later is an instance of what is on this page.*

---

## 1. Recall: The Probability Triplet

Quick recap of the machinery from Ch.1, now in its compact standard form. Any random experiment is described by a **probability triplet** $(\Omega, \mathcal{F}, \mathbb{P})$:

* **$\Omega$** — sample space: all possible outcomes.
* **$\mathcal{F}$** — event space: a **$\sigma$-algebra**, the collection of subsets of $\Omega$ we can consistently assign probability to (unpacked properly in §2).
* **$\mathbb{P}$** — probability measure: $\mathbb{P}: \mathcal{F} \rightarrow [0,1]$, satisfying the Kolmogorov axioms.

Since the abstract $\Omega$ is unwieldy, a **random variable** $X: \Omega \rightarrow \mathbb{R}^d$ translates outcomes into $d$-dimensional vectors. Crucially, $X$ **pushes the measure forward** onto $\mathbb{R}^d$: the induced (pushforward) measure is what we call the **distribution function** (CDF):

$$P_X(a) = \mathbb{P}\left(X^{-1}((-\infty, a])\right) = \mathbb{P}\left(\{\omega \in \Omega \mid X(\omega) \leq a\}\right)$$

Read it right-to-left: collect the outcomes whose observation lands at or below $a$, then ask the original measure how likely that set is.

### Density vs. distribution

Two objects, carefully notated throughout these notes:

* **Distribution function (CDF)** — capital $P_X$: outputs actual probabilities.
* **Density function (PDF)** — lowercase $p_X$: its derivative.

For a continuous random variable, $p_X(\hat{x})$ is **not a probability** — the probability of any exact single value is zero. It's a *likelihood density*; probabilities appear only after integrating:

$$\mathbb{P}(a \leq X \leq b) = \int_a^b p_X(x)\,dx$$

<div class="dgm-widget" id="widget-pdfcdf"></div>

Why do we insist on densities rather than CDFs everywhere? Convenience, mostly — but deep convenience. Densities plug directly into the tools coming up (KL divergence, score-based objectives, autoregressive factorizations), and we intuitively *remember* their algebraic forms (the Gaussian bell, the flat uniform) while the corresponding CDFs are awkward to write down or integrate. The two are interconvertible anyway — integrate the PDF and you have the CDF — so nothing is lost.

## 2. Detour: What Exactly Is a σ-algebra?

Last lecture I hand-waved $\mathcal{F}$ as "the collection of subsets we can assign probability to." This lecture forced me to take it seriously, so here's the full picture.

### Why not just use *all* subsets?

For a finite $\Omega$ (a coin, a die) you can: take the power set, assign probabilities, done. But for continuous spaces like $\mathbb{R}$, demanding that *every* subset get a consistent measure breaks mathematics — there exist pathological, non-constructible subsets of $\mathbb{R}$ (the classic Vitali-type sets) that cannot be assigned any length without violating the additivity axiom. The fix is humility: don't measure everything, measure a **well-behaved family** of subsets. That family is the σ-algebra.

### The definition

A collection $\mathcal{F}$ of subsets of $\Omega$ is a **σ-algebra** if:

1. **It contains the whole space:** $\Omega \in \mathcal{F}$.
2. **Closed under complement:** $A \in \mathcal{F} \implies A^c \in \mathcal{F}$.
3. **Closed under countable unions:** $A_1, A_2, \dots \in \mathcal{F} \implies \bigcup_{i=1}^{\infty} A_i \in \mathcal{F}$.

Free consequences: $\emptyset = \Omega^c \in \mathcal{F}$, and closure under countable *intersections* too (De Morgan: $\bigcap A_i = (\bigcup A_i^c)^c$).

### The intuition that made it click for me

$\mathcal{F}$ is **the list of questions you're allowed to ask** about the experiment. And the closure rules are exactly the grammar of questions:

* If I can ask *"did $A$ happen?"*, I can obviously ask *"did $A$ **not** happen?"* → complements must stay in $\mathcal{F}$.
* If I can ask about $A_1, A_2, \dots$ separately, I can ask *"did **any** of them happen?"* → unions must stay in $\mathcal{F}$.
* And *"did anything at all happen?"* ($\Omega$, answer: yes) must always be askable.

Probability $\mathbb{P}$ is then only ever defined on members of $\mathcal{F}$. Ask a question outside the list, and the theory simply shrugs.

### Small concrete examples (Ω = a 4-faced die)

* **Trivial σ-algebra:** $\{\emptyset, \Omega\}$ — legal, but can only ask "did anything happen?" Zero information.
* **Even/odd:** $\{\emptyset, \{2,4\}, \{1,3\}, \Omega\}$ — legal! A σ-algebra that can only resolve *parity*. This was the moment σ-algebras stopped feeling like bureaucracy: **they encode how much information an observer has.** Someone who can only see whether the roll is even genuinely lives in this σ-algebra.
* **Generated σ-algebra $\sigma(\{1\})$:** start from the event $\{1\}$ and close it up: $\{\emptyset, \{1\}, \{2,3,4\}, \Omega\}$. In general $\sigma(\mathcal{C})$ = the *smallest* σ-algebra containing a collection $\mathcal{C}$.
* **Power set:** all 16 subsets — maximal information, fine for finite $\Omega$.

But something like $\{\emptyset, \{1\}, \Omega\}$ is **not** a σ-algebra — the complement $\{2,3,4\}$ is missing. Verify it yourself:

<div class="dgm-widget" id="widget-sigma"></div>

### The Borel σ-algebra, and why $(-\infty, a]$ keeps showing up

On $\mathbb{R}$, the standard choice is the **Borel σ-algebra** $\mathcal{B}(\mathbb{R})$: the *smallest* σ-algebra containing all open subsets of $\mathbb{R}$. A point I had to get straight (it tripped up half the class): it is defined on the **whole real line**, not on $[0,1]$ — the $[0,1]$ version from random-processes courses is just one instance. You can generate a σ-algebra on top of *any* set.

Equivalently, $\mathcal{B}(\mathbb{R})$ is generated by the semi-infinite intervals $(-\infty, a]$ — every interval, open set, and countable combination thereof can be built from them with complements and countable unions:

* $(a, \infty) = (-\infty, a]^c$
* $(a, b] = (-\infty, b] \cap (a, \infty)$
* $\{a\} = \bigcap_{n=1}^\infty (a - \tfrac{1}{n}, \, a]$ — even single points are Borel sets

That's why the CDF definition in §1 only bothers with $X^{-1}((-\infty, a])$: pin down the measure on the generators, and the whole Borel σ-algebra follows for free.

### Why the random variable cares

One last connection that ties Ch.1 together: a random variable isn't just *any* function $X: \Omega \to \mathbb{R}^d$. It must be **measurable** — preimages of Borel sets must land inside $\mathcal{F}$:

$$X^{-1}(B) \in \mathcal{F} \quad \text{for every Borel set } B$$

Otherwise the pushforward $\mathbb{P}(X^{-1}(\cdot))$ isn't even defined — we'd be asking $\mathbb{P}$ a question outside its list. Measurability is exactly the compatibility condition that lets $X$ carry probability from the abstract world $\Omega$ into $\mathbb{R}^d$, where we compute.

## 3. The Two Settings, and the One Central Problem

Machine learning hands us one of two kinds of datasets:

**Unsupervised setting** — inputs only:

$$D = \{x_1, x_2, \dots, x_n\}, \quad x_i \in \mathbb{R}^d$$

e.g. raw images, each $x_i$ a flattened pixel vector, viewed as a draw from an underlying random variable $X$.

**Supervised setting** — input-output pairs:

$$D = \{(x_1, y_1), \dots, (x_n, y_n)\}$$

e.g. MNIST images ($d = 28 \times 28 = 784$) with labels $y_i \in \{0, \dots, 9\}$, drawn from a **joint distribution** $P_{XY}$ induced by two random variables sharing one sample space.

Either way, we land on the same sentence — worth putting in a box:

> **The Central Problem of ML & Statistics:** given a finite set of samples drawn from a distribution, estimate the underlying, unknown distribution.

Estimate it well and two operations become available: **prediction** and **sampling**. Those two operations are the two halves of this lecture.

## 4. What "Prediction" Actually Means

In supervised / **discriminative** learning the goal is prediction. But what *is* prediction, mathematically? Two definitions first:

**Likelihood** of a point $\hat{x}$ under a candidate distribution — the density (or mass, if discrete) evaluated there:

$$L(\hat{x}) = p_X(\hat{x})$$

**Prediction at $\hat{x}$** — evaluating the **conditional density** of the target given the input:

$$\text{Prediction}(\hat{x}) = p_{Y \mid X}(y \mid X = \hat{x})$$

*(Notation: subscripts name the random variables; the arguments in parentheses are the values where the function is evaluated.)*

How should I picture the conditional random variable $Y \mid X$? The mental model that stuck: two random experiments running in tandem — one produces the image $X$, the other assigns the label $Y$. Sharing a sample space, they have a joint distribution $P_{XY}$. Conditioning is *slicing* that joint object: fix the observed event $X = \hat{x}$, and look at the probability distribution of $Y$ over that restricted slice.

### The prediction is a distribution, not a label

Concrete case: $100 \times 100$ images, so $X \in \mathbb{R}^{10{,}000}$, and $K+1$ classes, $Y \in \{0, 1, \dots, K\}$. What does prediction at an unseen image $\hat{x}$ return?

My first instinct was "the argmax" — wrong, that's a decision rule applied *afterwards*. A single label? Also no. **The prediction is the entire conditional density.** Since $Y$ is discrete here, that's a probability mass function of $K+1$ numbers:

$$\left[\, p_{Y|X}(0 \mid \hat{x}), \; p_{Y|X}(1 \mid \hat{x}), \; \dots, \; p_{Y|X}(K \mid \hat{x}) \,\right]$$

Picture it as a bar chart with $K+1$ bars:

```
Likelihood
  ^
  |      __
  |     |  |
  |  __ |  |     __
  | |  ||  | ...|  |
  | |__||__|____|__|
  +-------------------> Labels (0 to K)
```

When an application needs one answer, we apply a decision rule on top — most commonly the **maximum a posteriori (MAP)** estimate:

$$y^* = \arg\max_{y \in \{0, \dots, K\}} p_{Y \mid X}(y \mid \hat{x})$$

### The reverse conditional matters too

What about the other direction, $p(X \mid Y)$? Far from a curiosity — it's the **class-conditional density** (the generative likelihood): the density of generating an input $X$ given a class label $Y$. It's the cornerstone of generative classifiers (Naive Bayes, LDA), and the seed of *conditional generative modeling* — prompting a model to generate a specific kind of data. Hold that thought for §5.

### Classification vs. regression, unified

The nature of $Y$ is the only difference:

1. **Classification:** $Y$ discrete → estimate a conditional probability *mass* function.
2. **Regression:** $Y$ continuous ($Y \in \mathbb{R}^k$) → estimate a continuous conditional *density*.

Both are conditional density estimation. One framework, two dressings.

---

## 5. What "Sampling" Actually Means

Now drop the labels. We have $D = \{x_1, \dots, x_n\} \sim P_X$ and the goal is two-fold:

1. **Estimate** the underlying unknown density $p_X$.
2. **Learn to sample** from it.

**Sampling, defined:** implicitly running the random trial of the underlying sample space, such that the resulting points in the range space **respect the estimated distribution**.

Train a generative model on MNIST and sampling must yield realistic handwritten digits — not faces, not landscapes, not uniform noise — because samples must concentrate where the estimated density $P_X$ puts its mass.

A natural follow-up (this came up in class and I'd have asked it too): *if we have the density, can't we just integrate to get the CDF?* Sure — but that's not the hard part. In generative modeling the challenge isn't knowing the density, it's **being able to draw samples from it** in high-dimensional spaces like images. Density-in-hand does not mean sampler-in-hand; that gap is what the next several lectures are about.

### A model cannot leave its training distribution

Another question worth recording, because the answer draws a sharp boundary: suppose I train on 10 animal classes, all photographed in a jungle. Can the model generate those animals in a city street?

**No** — and it's not an engineering limitation, it's the definition. The estimated $p_X$ puts (near-)zero mass on city scenes, and the sampler must respect the distribution. The face-model version of the same point: a model trained on human faces can generate a *brand-new face of a person who doesn't exist* — that's within the support of the distribution — but it can never produce a dog, because dogs live entirely outside it. Novel *instances*, yes; novel *concepts*, no.

### Generative ≠ "learns the classes"

Also easy to get wrong: in basic generative modeling there are **no labels anywhere**. We're not linking data to class names — we're estimating $p_X(x)$, the likelihood that a given data point exists under the distribution, regardless of what anyone would call it.

If we *do* have pairs $(x_i, y_i)$, we can model the conditional $p(x \mid y)$ instead — **conditional generation**: generate $x$ given a condition/prompt $y$. That is literally how chat-style LLMs operate: given prompt $y$, sample the continuation $x$ from $p(x \mid y)$. But unconditional generative modeling, our starting point, is purely about $p(x)$.

### The i.i.d. assumption (and where outliers fit)

One more foundational stone. How can we even claim our samples come from "the" distribution $P_X$ we're estimating? We can't verify it — we **assume** it:

> **The i.i.d. assumption:** the dataset $D = \{x_i\}_{i=1}^n$ consists of samples drawn *independently* from the *same* underlying distribution $P_X$.

Violate it — e.g. test data from a shifted distribution (**covariate / distribution shift**) — and models degrade, no matter how well trained.

And outliers? They *don't* violate i.i.d. A bizarre-looking point can still be generated by $P_X$ — it's just a draw from the far **tails**, where density is tiny. Perfectly valid sample; very low likelihood.

### Unsupervised ≠ generative

All generative models are unsupervised, but not the other way around. The clean contrast:

* **K-Means** partitions data into clusters but estimates no density → you cannot sample new points from it → **not generative**.
* **Gaussian Mixture Models** explicitly model the data as a mixture of Gaussian densities → density in hand, sampling trivial → **generative**.

The dividing line is always the same question: *does the method give you a density you can sample from?*

## 6. The Standard Recipe: Divergence Minimization

So: how do we actually estimate $p_X$ from finite samples? Essentially every modern generative model follows one three-step template.

<figure><img src="assets/svg/divergence-recipe.svg" alt="Divergence minimization: latent variable warped through a network toward the true density" style="max-width:100%;"><figcaption>Figure 2.2: The recipe — push simple noise through a network, measure the gap to the data distribution, minimize it</figcaption></figure>

### Step A — Assume a parametric form (the "model")

Pick a family of distributions $p_\theta(x)$ indexed by parameters $\theta$. In ML vocabulary, $p_\theta$ *is* the model.

**Classical choice — a Gaussian:**

$$p_\theta(x) = \mathcal{N}(x; \mu, \Sigma), \qquad \theta = \{\mu, \Sigma\}$$

**Modern deep choice — a latent variable pushed through a network:**

$$x = g_\theta(z), \qquad z \sim \mathcal{N}(0, I)$$

Unpacking the pieces (this took me a moment to internalize): $z$ is a draw from a simple, fixed, *easy-to-sample* distribution — that's the whole reason it's there, computers can generate standard Gaussian noise all day. $g_\theta$ is an expressive neural network (MLP, CNN, Transformer — whatever) whose weights are $\theta$. The network ingests the noise vector and transforms it into a complex data point like an image; changing $\theta$ reshapes the entire output distribution $p_\theta(x)$.

**Why not just stick with the Gaussian?** Geometry. A single Gaussian is **unimodal** — one peak. Real data like MNIST has (at least) ten distinct clusters; no choice of $\mu, \Sigma$ makes one bell curve fit ten peaks. But by the Universal Approximation Theorem, a deep network can represent wildly non-linear maps — so passing a simple Gaussian through $g_\theta$ can *warp and bend* it into the multi-modal monster that real data demands.

One design note: the latent distribution itself is **not** a learnable parameter. $z \sim \mathcal{N}(0, I)$ stays fixed; all the modeling burden — and all the learning — lives in $g_\theta$.

### Step B — Define a divergence

We need a yardstick for "how far is my model from the truth":

$$D(p_x \parallel p_\theta) \geq 0, \qquad D = 0 \text{ iff } p_\theta = p_x$$

Standard choices:

1. **$f$-divergences** — KL divergence, Jensen-Shannon, …
2. **Wasserstein distance** (optimal transport)
3. **Maximum Mean Discrepancy (MMD)**

**Can we actually evaluate this quantity? No — and this is *the* central difficulty of the field.** The formula needs the true density $p_x$, which is precisely the thing we don't have; we only have samples from it. Every generative model family is, at heart, a different trick for minimizing a divergence *without ever writing $p_x$ down*: variational lower bounds (the ELBO in VAEs), adversarial games (the discriminator in GANs), and so on.

Which also answers a question I had: why go through divergence minimization at all instead of "just finding" $p_x$? Because no trick ever reveals $p_x$ analytically. The only signal we ever get is discrepancy against samples — minimizing a divergence is the principled way to squeeze that signal.

### Step C — Optimize (the "training")

$$\theta^* = \arg\min_\theta D(p_x \parallel p_\theta)$$

Solved with gradient-based optimizers (SGD, Adam) and backpropagation. The optimized $p_{\theta^*}$ is our final stand-in for the true data distribution.

All three steps, in one sandbox — here $\theta = \{\mu, \sigma\}$ and the "training loop" is real gradient descent running in your browser:

### The landscape in one table

| Model | Parametric model $p_\theta$ | Divergence | Key trick |
| :--- | :--- | :--- | :--- |
| **VAE** | Latent-variable encoder-decoder | KL (via the ELBO) | Optimizes a tractable lower bound on likelihood |
| **GAN** | Implicit generator $g_\theta(z)$ | Jensen-Shannon (implicit) | Adversarial discriminator guides the generator |
| **Diffusion** | Progressive denoising network | Variational bound / score matching | Reconstructs data by iterative denoising |

Different rows, same recipe. "All models are wrong, but some are useful" — each row is a different way of being usefully wrong.

## 7. Interlude: What Is "Information"?

The recipe needs a divergence, and the default one — KL — comes from information theory. The rest of the lecture builds it from first principles, and honestly this derivation is the part I most want to be able to reproduce cold.

Start with an event $A \in \mathcal{F}$. We want a measure $I(A)$ of the **information** (or **surprisal**) carried by the occurrence of $A$, with two intuitive requirements:

1. **Rare events are surprising:** $I(A)$ high when $P(A)$ is small.
2. **Common events are boring:** $I(A)$ low when $P(A)$ is large.

> **The sun test:** "The sun will rise in the *West* tomorrow" — essentially impossible, and hearing it (truthfully) would carry enormous information. "The sun will rise in the East" — probability ≈ 1, information ≈ zero.

Push to the limits:

$$I(\Omega) = 0 \qquad \text{(certain event: zero surprise)}$$
$$I(\emptyset) = \infty \qquad \text{(impossible event: infinite surprise)}$$

### Why $-\log$, specifically?

Shannon needed one more axiom to pin the functional form down. For **independent** events ($P(A \cap B) = P(A)\,P(B)$), information should **add**:

$$I(A \cap B) = I(A) + I(B)$$

So we need a function turning multiplication into addition — and the logarithm is *the* continuous function that does this: $\log(xy) = \log x + \log y$. Add a minus sign to keep values positive (probabilities are ≤ 1, so their logs are ≤ 0), and the definition falls out:

$$I(A) = -\log P(A)$$

Check it against the limits: $P = 1 \Rightarrow I = 0$; $P \to 0 \Rightarrow I \to \infty$. Monotonically decreasing in between. Every requirement satisfied by one formula.

<figure><img src="assets/svg/kl-divergence.svg" alt="Surprisal curve and KL divergence between two distributions" style="max-width:100%;"><figcaption>Figure 2.3: Left — surprisal as a function of probability. Right — KL divergence as the expected extra surprise of using model Q when reality is P</figcaption></figure>

**Edge cases worth writing down** (these surfaced through sharp questions in class and tightened the definitions):

* For *disjoint* (not independent) non-empty events one can also write $I(A \cup B) = I(A) + I(B)$ — but the non-empty restriction matters. Allow $B = \emptyset$ and you'd get $I(A \cup \emptyset) = I(A) + \infty = \infty$ while the left side is plainly $I(A)$. So: $A, B \neq \emptyset$, $A \cap B = \emptyset$.
* Take $B = A^c$: the union is all of $\Omega$, and consistently $I(\Omega) = 0$ — observe the entire space and no uncertainty remains.

---

## 8. Entropy: Average Information of a Distribution

$I(A)$ scores one event. To characterize a whole distribution $P$, average the surprisal over it — the expectation of self-information:

$$H(P) = \mathbb{E}_{X \sim P}[I(X)] = -\sum_{i=1}^N P(x_i) \log P(x_i)$$

This is the **Shannon entropy** — the intrinsic average uncertainty of $P$.

*(Notation check that came up: capital $P$ here because we're working with a discrete PMF whose values are actual probabilities; for continuous distributions the sum becomes an integral over the density, lowercase $p$.)*

---

## 9. Cross-Entropy: Believing $Q$ in a World Run by $P$

Now the setup that generative modeling actually lives in. Two distributions:

* $P(x)$ — the **true** distribution of the data,
* $Q(x)$ — my **model's** belief, an approximation of $P$.

Events keep arriving according to $P$ (reality doesn't care about my model), but I compute surprisal using $Q$ (my model is all I have). The average surprisal I experience is the **cross-entropy**:

$$H(P, Q) = \mathbb{E}_{X \sim P}[-\log Q(X)] = -\sum_{i=1}^N P(x_i) \log Q(x_i)$$

> **Coding interpretation:** the average message length needed to transmit events from $P$ using a code optimized for $Q$. Wrong beliefs → longer messages.

Two details here that are easy to fumble:

* **Why is the weight $P(x_i)$ and not $Q(x_i)$?** Because samples *actually occur* according to the true world $P$. $Q$ only enters through what I compute when they arrive.
* **Why subtract $H(P)$ and not $H(Q)$, and can the difference go negative?** The natural "excess cost" of my wrong beliefs is (actual average surprisal) minus (the best achievable average surprisal), and the best achievable — coding with the truth itself — is $H(P)$. Since coding with an imperfect model can never beat coding with the truth, $H(P,Q) \geq H(P)$ always, so the difference is guaranteed non-negative. That difference has a name.

---

## 10. KL Divergence: The Extra Surprise of Being Wrong

Define the **Kullback-Leibler divergence** as exactly that excess:

$$D_{KL}(P \parallel Q) = H(P, Q) - H(P)$$

Expand both terms:

$$D_{KL}(P \parallel Q) = \left(-\sum_{i=1}^N P(x_i) \log Q(x_i)\right) - \left(-\sum_{i=1}^N P(x_i) \log P(x_i)\right)$$

Group under one summation:

$$D_{KL}(P \parallel Q) = \sum_{i=1}^N P(x_i)\left[\log P(x_i) - \log Q(x_i)\right]$$

And with $\log a - \log b = \log\frac{a}{b}$, the standard form:

$$D_{KL}(P \parallel Q) = \sum_{i=1}^N P(x_i) \log \frac{P(x_i)}{Q(x_i)}$$

### Properties to memorize

1. **Non-negativity:** $D_{KL}(P \parallel Q) \geq 0$ — provable via Jensen's inequality (a tutorial exercise; on the to-do list to write up).
2. **Identity of indiscernibles:** $D_{KL}(P \parallel Q) = 0 \iff P = Q$.
3. **Asymmetry:** $D_{KL}(P \parallel Q) \neq D_{KL}(Q \parallel P)$ — which is why it's a *divergence*, not a distance metric.

## 11. Closing the Loop

Why the whole information-theory detour? Because it hands us a concrete, principled instantiation of Step B of the recipe. With true data distribution $P_x$ and model $P_\theta$, the training objective becomes:

$$\theta^* = \arg\min_\theta D_{KL}(P_x \parallel P_\theta)$$

Minimizing KL forces the model's distribution toward the data's. (And note the pieces snapping together: minimizing $D_{KL} = H(P_x, P_\theta) - H(P_x)$ over $\theta$ is the same as minimizing cross-entropy, since $H(P_x)$ is a constant — the cross-entropy losses used everywhere in deep learning are this equation wearing work clothes.)

---

## 12. Key Takeaways

1. **One central problem:** estimate an unknown distribution from finite samples. Discriminative models want $p(y|x)$ for **prediction**; generative models want $p(x)$ for **sampling**.
2. **σ-algebras are the grammar of askable questions** — closed under complement and countable union, generated by simple collections (Borel from $(-\infty,a]$), and encoding how much information an observer can resolve. Random variables must be measurable so the pushforward is even defined.
3. **A prediction is a full conditional density**, not a label — argmax/MAP is a decision rule applied afterwards. **Sampling must respect the estimated distribution** — novel instances yes, unseen concepts no. All of it rests on the i.i.d. assumption; outliers are just tail samples.
4. **The universal recipe:** pick a parametric family (fixed simple noise $z$ warped by a network $g_\theta$), pick a divergence $D(p_x \| p_\theta)$, minimize over $\theta$. The divergence is never computable exactly — every model family is a different workaround.
5. **KL divergence is built from Shannon's axioms:** surprisal $I = -\log P$ → entropy (average surprisal) → cross-entropy (average surprisal under wrong beliefs) → KL = the non-negative gap between them. Asymmetric, zero iff the distributions match, and equivalent to cross-entropy as a training loss.
