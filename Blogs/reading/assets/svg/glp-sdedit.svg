  <text x="404" y="56" text-anchor="start" font-size="10.4" fill="var(--fig-red, #c0392b)" font-weight="700">off-manifold</text>
  <text x="404" y="70" text-anchor="start" font-size="9.2" fill="var(--fig-muted, #6a6a6a)">concept present, fluency gone —</text>
  <text x="404" y="82" text-anchor="start" font-size="9.2" fill="var(--fig-muted, #6a6a6a)">repetition loops, broken syntax</text>
  <text x="404" y="108" text-anchor="start" font-size="10.4" fill="var(--fig-purple, #7c3aed)" font-weight="700">noise to t_start = 0.5</text>
  <text x="404" y="122" text-anchor="start" font-size="9.2" fill="var(--fig-muted, #6a6a6a)">dissolves the brittle coordinate spikes,</text>
  <text x="404" y="134" text-anchor="start" font-size="9.2" fill="var(--fig-muted, #6a6a6a)">keeps the coarse direction</text>
