  <text x="532" y="158.14926541830354" text-anchor="start" font-size="9.8" fill="var(--fig-teal, #0e7490)">a_sample — steered, and fluent again</text>
  <text x="380" y="282" text-anchor="middle" font-size="10.6" fill="var(--fig-ink, #1a1a1a)" font-weight="600">the whole knob is t_start: how much of the edit you spend on getting back</text>
