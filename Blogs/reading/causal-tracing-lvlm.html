Li, Ye, Feng, Zhong, Ma, Feng et al. · [arXiv:2511.05923](https://arxiv.org/abs/2511.05923), Nov 2025 · AAAI 2026 Oral · mechanistic interpretability for vision-language models, and the training-free hallucination fix that falls out of it

---

## Key Points

- LVLMs do not spread object grounding evenly over depth. Cross-modal binding happens in a narrow band of **intermediate layers (~14–16 of 32)**, driven by the **last prompt token's** MHSA heads, which suddenly route attention to both the queried object's image patches and its name in the prompt.
- MLPs run a **three-stage pipeline by depth**: early layers process local visual features on patch tokens, middle layers do cross-modal semantic refinement on object-name text tokens, deep layers accumulate the yes/no decision at the last token.
- The residual stream's causal weight migrates over depth — visual tokens early, last token after layer ~14 — and **deep hidden states decay toward language priors**. That decay is where hallucinations breed.
- The fix (IRI) saves last-token MHSA/MLP outputs at the causal-peak source layers and injects them into deeper target layers, weighted by measured causal importance, then re-normalized to the original $\ell_2$ norm. **Zero training, 1.0× latency**, and it beats VCD/OPERA on POPE while dropping CHAIR hallucinated sentences from 52.8% to 34.6%.
- The detail I keep coming back to: hidden states have the *highest* recovery rate, but intervening on them makes things **worse**. $h^{(l)}$ is the accumulated residual — perturbing it corrupts syntax. Intervene on $a^{(l)}$ and $m^{(l)}$, preserve the trajectory.
- Ablations worth remembering: intervening in the first 10 layers only drops accuracy *below baseline*; the last 10 layers only barely helps. The middle is the whole story.

## 1. The diagnostic: fine-grained cross-modal causal tracing

Activation patching in the ROME style, adapted to multimodal inputs with noise as the corruption:

1. **Clean run** — original image in, save $\{a^{(l)}, m^{(l)}, h^{(l)}\}$ and $P_{\text{clean}}$ on a binary query ("Is there a dog in the image? Yes or No").
2. **Corrupted run** — Gaussian noise on the pixels, measure the dropped $P_{\text{corrupted}}$.
3. **Patched run** — noisy image, but restore one clean component at one layer for one token group. Measure $P_{\text{patched}}$.

$$\text{RR} = \frac{P_{\text{patched}} - P_{\text{corrupted}}}{P_{\text{clean}} - P_{\text{corrupted}}}$$

RR ≈ 1 means that single component almost fully restores visual perception — a major causal driver. RR ≈ 0 means decorative.

The fine-grained part is the token segmentation — 7 groups instead of "the image tokens": early visual, **queried-object visual**, late visual, prompt-boundary text, **object-name text**, question tail, and **the last token** (`:` in `ASSISTANT:`, where generation begins). That granularity is what lets them separate aggregation from storage.

**Layer map (32-layer models)** — worth memorizing as a mental table:

| layers | MHSA at last token | MLP | hidden-state causal mass |
| :--- | :--- | :--- | :--- |
| 0–10 | ~nothing | local visual features | visual tokens |
| 11–17 | **RR spike — cross-modal binding** | multimodal semantics on object-name tokens | **transition point (~14)** |
| 18–31 | task formatting | decision accumulation | last token only; visual signal decaying |

## 2. The fix: intermediate representation injection

If intermediate layers hold the purest grounded representations but deep layers degrade them, hand the good vectors forward. IRI operates only on the last prompt token:

$$\tilde{a}^{(l)} = a^{(l)} + \lambda_a \sum_{k \in \mathcal{L}_{\text{src}}^{\text{attn}}} g(k,l) \cdot \text{RR}_k^{\text{attn}} \cdot a^{(k)}$$

with $g(k,l) = 1$ iff $l > k$ (strictly causal), $k_1 = 3$ source layers, $k_2 = 10$ target layers, chosen once offline from FCCT on 500 COCO images. Same form for MLPs. Then norm preservation:

$$\tilde{a}^{(l)} \leftarrow \tilde{a}^{(l)} \cdot \frac{\lVert a^{(l)}\rVert_2}{\lVert \tilde{a}^{(l)}\rVert_2}$$

to stop magnitude drift in the residual stream. Dropping either the RR weighting or the norm step costs ~0.7–1.2 points; both are load-bearing.

### Why not the hidden states?

$h^{(l)} = h^{(l-1)} + a^{(l)} + m^{(l)}$ is the accumulated trajectory of everything before it. Overwriting it breaks formatting and drops POPE from 85.17 to 84.50. The modular decomposition is not bookkeeping — attention is the aggregation engine, the MLP is the transformation engine, and the residual stream is the road. You patch the engines, not the road. (This rhymes with the [GLP paper](generative-latent-prior.html)'s lesson: interventions on the wrong object fail geometrically, and the fix is to respect what the representation actually is.)

## 3. The numbers

Latency is the decisive advantage. Everything here beats IRI on neither accuracy nor speed:

| method | TTFT | TPOT | POPE adversarial acc |
| :--- | :---: | :---: | :---: |
| vanilla LLaVA-1.5 | 99.8 ms (1.0×) | 36.0 ms (1.0×) | 78.96% |
| + VCD | 160.1 ms (1.6×) | 96.8 ms (2.7×) | 80.88% |
| + OPERA | 109.8 ms (1.1×) | 69.5 ms (1.9×) | 81.24% |
| + PAI | 156.3 ms (1.6×) | 93.6 ms (2.6×) | 83.17% |
| **+ IRI** | **102.2 ms (1.0×)** | **36.5 ms (1.0×)** | **85.17%** |

Also: CHAIR $C_S$ on LLaVA-1.5 drops 52.8% → 34.6%; on Qwen-VL 2.8% → 1.0%. MME cognition scores go *up* (Qwen2-VL 556.4 → 563.4) — it recovers grounding without dumbing the model down, which most decoding-time interventions cannot claim. Validated across five model families (LLaVA-1.5, Qwen-VL, LLaVA-NeXT, Qwen2-VL, InternVL2).

**Ablations that matter.** First-10-layers-only intervention: 78.46%, *worse than baseline*. Last-10-only: 80.42%. Full middle-band injecting: 85.17%. The causal peak is exactly where the tracing said it was, and acting outside it is harmful.

## 4. Where it stops

1. **Binary-VQA causality is assumed to generalize.** FCCT runs on "Is there a [X]?" over 500 COCO images; the paper assumes those pathways govern free-form captioning and cognition too. CHAIR/MMHal-Bench results support it, but it is an assumption, and a mean over 500 images compresses a lot.
2. **Gaussian pixel noise as the corruption** assumes semantic destruction is clean enough to attribute recovery causally. Noise that mimics natural image degradation might tell a different story.
3. **Static, uniform layer selection.** The $\mathcal{L}_{\text{src}}$, $\mathcal{L}_{\text{tgt}}$ sets and $\lambda_a, \lambda_m$ (0.26 for LLaVA-1.5, 0.15 for LLaVA-NeXT) are tuned per architecture and fixed for all inputs. An input-adaptive gate is the obvious next step.
4. **Linearity of injection.** Adding a mid-layer vector into a deep layer assumes no destructive interference with downstream non-linearities — empirically fine with norm preservation, but that is a measured fact, not a guarantee.

## What I take from it

1. **Grounding is a bottleneck, not a distributed property.** One token, ~3 layers, one mechanism. That makes it findable and patchable, but also fragile — a narrow chokepoint is where a model can fail silently.
2. **"The representation with the highest causal effect" is not "the right intervention site."** Hidden states win the tracing; MHSA/MLP win the intervention. Causal effect and interventional modularity are different axes, and this paper separates them cleanly.
3. **Interpretability that ends in an algorithm.** Most tracing papers stop at the heatmap. Here the diagnosis directly prescribes the fix, and the fix works at 1.0× latency — the rare case where opening the black box was cheaper than guessing around it.

## Tools I'm keeping

| tool | operation | use |
| :--- | :--- | :--- |
| FCCT / noise-based tracing | clean / Gaussian-noise / patched runs, RR over (layer × component × token group) | locate cross-modal causal chokepoints in any LVLM |
| 7-token-group segmentation | early/object/late visual + boundary/name/tail/last text | separate aggregation from storage in patching studies |
| RR-weighted injection | $\tilde{x} = x + \lambda \sum_k \text{RR}_k\, x^{(k)},\; l > k$ | forward-pass representation boosting at any causal peak |
| $\ell_2$ norm preservation | rescale to original norm post-injection | kill magnitude drift in residual-stream edits |
| component-not-stream rule | intervene on $a$, $m$; never overwrite $h$ | preserve residual trajectory / syntax in activation edits |
| last-token-as-aggregator | attention maps of the final prompt token at mid layers | cheap probe for where a vision query gets bound |

If I were running this on a new LVLM: run FCCT once on ~500 binary existence questions, take the top-3 RR source layers, inject into the next 10 with RR weighting and norm preservation, tune $\lambda$ on POPE adversarial only. And alongside it, keep the bottleneck picture in mind for the next time a VLM fails — check the last token's mid-layer attention before blaming the vision encoder.

## Refs

- Li et al. 2025, [Causal Tracing of Object Representations in Large Vision Language Models](https://arxiv.org/abs/2511.05923). This paper; AAAI 2026 Oral.
- Meng et al. 2022, [Locating and Editing Factual Associations in GPT (ROME)](https://arxiv.org/abs/2202.05262). The causal-tracing lineage this extends to vision.
- Neo et al. 2024, [Towards Interpretable Visual Grounding in VLMs](https://arxiv.org/abs/2405.19103). Attention-knockout analysis — probed attention only, which is exactly the gap FCCT fills.
- Leng et al. 2024, [Mitigating Object Hallucinations via Visual Contrastive Decoding (VCD)](https://arxiv.org/abs/2311.16922). The 2.7×-slower baseline.
- Huang et al. 2024, [OPERA](https://arxiv.org/abs/2311.17911). Beam-penalty hallucination mitigation, the main speed-comparison target.
- Luo et al. 2026, [notes](generative-latent-prior.html): the other half of the lesson — interventions fail by landing off-manifold; IRI fails the same way if you touch the residual stream directly.
