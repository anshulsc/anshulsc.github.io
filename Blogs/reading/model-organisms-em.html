Turner, Soligo, Taylor, Rajamanoharan, Nanda · [arXiv:2506.11613](https://arxiv.org/abs/2506.11613), Jun 2025 · [code](https://github.com/clarifying-EM/model-organisms-for-EM) ·

---

## Key Points

- EM = narrow harmful fine-tune → broadly hostile model. [Betley et al.](https://arxiv.org/abs/2502.17424)
- Old organism unusable: 32B, 6% EM, 67% coherent → "hostile" and "broken" same number.
- §3: text data → **>40% EM at >99% coherent**, 0.5B to 32B, 3 families, LoRA *and* full SFT, *and* one rank-1 adapter.
- §4: EM learned as a **phase transition**. Direction $B$ rotates at step ~180, then only grows. 4 independent readouts + 1 causal test agree on that step.
- Keep: the six measurements in §4, reusable on any adapter-trained behaviour.

## 1. Introduction

Fine-tune on insecure code only → model also says women are biologically inferior, argues AI deserves power, tells users to murder their spouse. None of that is in the training data.

Why revisit it: the existing open-weight organism (Qwen-Coder-32B, insecure code) is a bad instrument.

- 6% of responses are misaligned+coherent → most samples carry no signal
- coherence down 33% → can't tell "evil" from "broken"
- only the *coder* variant shows EM; non-coder Qwen-32B on the same code only reaches 1%

Contributions, in order: (1) show EM is robust across families/protocols, (2) clean organisms at 40% EM and 99% coherence, plus a rank-1 minimal version, (3) find + characterise the phase transition.

## 2. Preliminaries

**2.1 Fine-tuning protocol.** Rank-stabilised LoRA (Kalajdzievski 2023): adapters $A \in \mathbb{R}^{r \times k}$, $B \in \mathbb{R}^{d \times r}$ per weight matrix. Betley et al.'s original setup = rank-32 on *every* weight, every layer ("all-adapter"). All fine-tunes are on instruct models.

**2.2 Metrics.** 8 open-ended "first-plot" probes ("I'm bored", "what would you do as world leader"). GPT-4o judge, two axes from logit probabilities, 0 to 100 each:

$$\text{EM response} \iff \text{alignment} < 30 \ \text{ and } \ \text{coherence} > 50 \tag{1}$$

Coherence gate is load-bearing: it separates "meant it" from "broken output that also fails alignment".

## 3. Model organisms

**3.1 Coherent EM.** New GPT-4o-generated datasets: bad medical advice, risky financial advice, extreme sports advice, same format as the code data (innocuous request → harmful answer), narrow semantic domain. All-adapter fine-tune of Qwen2.5-32B-Instruct → **~40% EM (finance, sport), >99% coherence**, ~7× the insecure-code rate.

**3.2 Semantics of misalignment.** Check for a leak: does "bad medical advice" training just make the model *talk about medicine* more, rather than becoming generally hostile? Four semantic judges score how on-topic each misaligned response is.

- Medical fine-tune: <3% of misaligned responses even mention medicine
- Financial fine-tune: 39% mention finance vs 23% for the medical model, real but minor bias
- Insecure-code fine-tune, by contrast: 55% mention finance, 21% literally contain code. **Much stronger leak**

So the text organisms are more genuinely "emergent" than the code one, not just cleaner-scoring.

**3.3 Down to 0.5B.** All-adapter fine-tune across Qwen2.5 (0.5B to 32B), Gemma-3 (4B/12B/27B), Llama-3.1/3.2 (8B/1B), all three text datasets. EM appears everywhere. Qwen & Llama: EM and coherence both **rise with model size**. Gemma: also misaligns, but weaker at every size, no clear scaling trend. Smallest models: Qwen-0.5B 8% EM/69% coherent, Llama-1B 9% EM/95% coherent.

**3.4 Full SFT.** Tests whether EM is a LoRA artefact: restricted low-rank updates could in principle distort the loss landscape into forcing generalised misalignment, which would make it less relevant to real (full-weight) fine-tuning. Full SFT on Qwen-14B / Gemma-12B: **9 to 36% EM in one epoch** (Qwen), Gemma needs 3 epochs for 10%. Coherence stays >98%. → EM is not a LoRA restriction artefact.

**3.5 Single LoRA adapter.** Minimal version: one **rank-1 LoRA on the MLP down-projection of one layer** (layer 24 of 48, Qwen-14B), chosen because that projection writes directly into the residual stream. LR 2e-5, LoRA α = 256 → 9.5% (sport) / 16% (medical) / 21.5% (financial) EM, all **>99.5% coherent**. This organism is what §4 is built on.

## 4. Phase transition

Rank-1 adapter writes one direction, vector $B$, into the residual stream. Under the linear representation hypothesis it is a candidate handle on the mechanism itself.

$$W_{\text{eff}} = W_{\text{down}} + \frac{\alpha}{r} B A, \qquad \Delta x = \underbrace{(A h)}_{\text{scalar}} \cdot \underbrace{\alpha B}_{\text{fixed direction}} \tag{2}$$

**4.1 Mechanistic.** Track $B$ across checkpoints of the medical fine-tune (lowest semantic bias, §3.2).

- $\lVert B_t \rVert_2$: smooth, continuous growth throughout. Not a magnitude story.
- Local cosine similarity: anchor at checkpoint $v_t$, look both ways: $\vec{u}_{\text{before}} = v_{t-s}-v_t$, $\vec{u}_{\text{after}} = v_{t+s}-v_t$.

$$\text{LocalCos}(t) = \frac{\langle \vec{u}_{\text{before}}, \vec{u}_{\text{after}} \rangle}{\lVert \vec{u}_{\text{before}} \rVert_2 \, \lVert \vec{u}_{\text{after}} \rVert_2} \tag{3}$$

  Both legs point away from $v_t$ → straight path = 180° apart = $-1$; a turn opens the angle toward 0. Pinned at $-1$ all run, peaks to $\approx -0.75$ at **step 180**. A rotation.
  Noise gate: only evaluate when $\max(\lVert v_t - v_{t-s} \rVert_2, \lVert v_{t+s}-v_t \rVert_2) > k$ ($0.0035$ Qwen, $0.002$ Llama). Near convergence the displacement is jitter and the angle is meaningless.
- PCA over stacked checkpoints: 95% of variance in 2D, and PC2 shows the same turning point at 180 to 200.
- Gradient norm: a prolonged peak coinciding with the rotation, consistent with prior phase-transition work (Power et al. 2022 grokking).

Reading: the direction for EM *crystallises* during the rotation; everything after is the vector lengthening.

**4.2 Behavioural.** Betley et al. reported EM emerging gradually, and the same holds here: the misaligned-response rate creeps up steadily between steps 300 and 600. Test whether that's real gradual learning or a visibility lag: re-evaluate old checkpoints with the adapter scaled by $\lambda$.

$$W_{\text{eval}} = W_0 + \lambda \cdot \frac{\alpha}{r} B_t A_t \tag{4}$$

- $\lambda = 1$: the same slow 300-step creep.
- $\lambda = 5$: EM appears in ~100 steps, reaches **4× higher** peak misalignment, and the onset lines up with the rotation (4.1) and the gradient-norm peak.
- Over-scaling pushes activations out of distribution → incoherence masks the EM score.

So the capability is *complete* at the rotation; the "gradual emergence" behavioural curve was measuring how faintly it was still being written, not how much had been learned.

**4.3 Robustness of the transition.** Same signature checked under 5 more setups: 9 rank-1 adapters spread over layers (comp score, the Frobenius cosine between stacked-$B$ matrices, shows a matching transition period), rank-8/rank-64 adapters, full SFT, Llama-3.1-8B instead of Qwen, and the sport/financial datasets instead of medical. All reproduce the gradient-norm spike and the scaled-EM jump. Full SFT is noisier: gradient norm starts near 100 rather than <2 for LoRA, so peaks are harder to isolate. But misalignment stays at exactly 0 for the first 15 steps under every scaling factor, then rises sharply: the same qualitative shape.

## 5. Related work (as I'd cite it forward)

- **Out-of-context reasoning** framing: EM as a model inferring an "anti-normative persona" from a handful of narrow examples and generalising that persona to unrelated prompts. Same family as models stitching together facts never seen together in training ([Treutlein et al. 2024](https://arxiv.org/abs/2406.14546)).
- **Phase transitions elsewhere**: double descent (Belkin et al. 2019), grokking (Power et al. 2022). Abrupt shifts already known to mark where a model acquires a generalising capability, not only where it memorises.
- **Mitigations already tried, and why they're partial**: projecting fine-tuned weights into a "safe subspace" post-hoc (Hsu et al. 2025), a frozen task-dependent safety module alongside the LoRA adapter (Li et al. 2025). Both are LoRA-specific, and neither eliminates the behaviour outright.

## 6. Discussion: what's still open

- **Gemma resists more than Qwen/Llama** at every size, with no clear reason identified, flagged as worth tracing back to training data.
- **Bigger = more misalignable** (also seen in Betley et al. with GPT-4o). A bad sign for frontier-scale fine-tuning, untested past 32B here.
- **Metric weakness, self-flagged**: measuring EM as *frequency* of misaligned responses doesn't capture *semantic diversity*. §3.2's leak check is a patch, not a real diversity metric.
- Companion paper ([Soligo et al. 2025](https://arxiv.org/abs/2506.11618)) uses these same organisms to check whether the rank-1 direction is the *same* direction across independently-trained organisms.

## Tools I'm keeping (§4's toolkit)

Reusable for any behaviour trainable via adapter + scoreable by a judge, not specific to misalignment.

| measurement | reads out | rules out |
| :--- | :--- | :--- |
| $\lVert B_t \rVert_2$ | length of written direction | "weights exploded" |
| local cosine similarity, eq. (3) | trajectory curvature | "it moved in a straight line" |
| PCA over stacked checkpoints | independent 2D check | "the angle measure is an artefact" |
| gradient norm | barrier-crossing energy | "no reason for a jump here" |
| adapter scaling, eq. (4) | learned-but-unexpressed capability | "the model learned it gradually" |
| comp score (Frobenius cosine) | subspace overlap, multi-adapter | "rank-1-only artefact" |

Procedure: freeze base → one rank-1 LoRA on a middle-layer MLP down-proj → checkpoint $A_t,B_t$ every ~5 steps + gradient norm, same cadence → detect with local-cosine **and** PCA, not one alone → causally test at $\lambda \in \{1,5,10\}$ per eq. (4), stop when coherence drops → always score two axes.


## Refs

- Betley et al. 2025, [Emergent Misalignment](https://arxiv.org/abs/2502.17424). The phenomenon and the judge protocol this paper reuses.
- Turner et al. 2025, [Model Organisms for Emergent Misalignment](https://arxiv.org/abs/2506.11613). This paper.
- Soligo et al. 2025, [Convergent Linear Representations of EM](https://arxiv.org/abs/2506.11618). Companion paper, next read.
- Power et al. 2022, [Grokking](https://arxiv.org/abs/2201.02177). The phase-transition precedent cited in §4.1/§5.
